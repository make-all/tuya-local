name: Fireplace
products:
  - id: m0chyz1cdsaltkmd
    model: EF-R Pro
entities:
  - entity: climate
    icon: "mdi:fireplace"
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: integer
        name: temperature
        range:
          min: 17
          max: 37
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: "1"
                range:
                  min: 63
                  max: 99
      - id: 3
        type: integer
        name: current_temperature
      - id: 4
        type: string
        name: preset_mode
        mapping:
          - dps_val: Lo
            value: low
          - dps_val: HI
            value: high
          - dps_val: "OFF"
            value: standby
      - id: 13
        type: string
        name: temperature_unit
        mapping:
          - dps_val: "1"
            value: F
          - value: C
  - entity: light
    translation_key: flame
    category: config
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 5
        type: string
        name: named_color
        mapping:
          - dps_val: F01
            value: yellow
          - dps_val: F02
            value: red
          - dps_val: F03
            value: blue
          - dps_val: F04
            value: lime
          - dps_val: F05
            value: purple
          - dps_val: F06
            value: cyan
          - dps_val: F07
            value: brown
          - dps_val: F08
            value: pink
          - dps_val: F09
            value: lightblue
          - dps_val: F10
            value: lightgreen
          - dps_val: F11
            value: mediumpurple
          - dps_val: F12
            value: lightcyan
          - dps_val: F13
            value: lightgray
          - dps_val: F14
            value: white
      - id: 5
        type: string
        name: effect
        mapping:
          - dps_val: F14
            value: Cycle
          - dps_val: F01
            value: "off"
          - value: "off"
            hidden: true
  - entity: light
    translation_key: embers
    category: config
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 101
        type: string
        name: named_color
        mapping:
          - dps_val: C01
            value: yellow
          - dps_val: C02
            value: red
          - dps_val: C03
            value: blue
          - dps_val: C04
            value: lime
          - dps_val: C05
            value: purple
          - dps_val: C06
            value: cyan
          - dps_val: C07
            value: brown
          - dps_val: C08
            value: pink
          - dps_val: C09
            value: lightblue
          - dps_val: C10
            value: lightgreen
          - dps_val: C11
            value: mediumpurple
          - dps_val: C12
            value: lightcyan
          - dps_val: C13
            value: lightgray
          - dps_val: C14
            value: white
      - id: 101
        type: string
        name: effect
        mapping:
          - dps_val: C14
            value: Cycle
          - dps_val: C01
            value: "off"
          - value: "off"
            hidden: true
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 13
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: celsius
          - dps_val: "1"
            value: fahrenheit
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
          - dps_val: "9h"
            value: "9h"
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 23
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 23
        type: bitfield
        name: fault_code
