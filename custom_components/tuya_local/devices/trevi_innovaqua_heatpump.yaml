name: Pool heat pump
products:
  - id: bqfay9re2z3hfhoq
    manufacturer: Trevi
    model: InnovAqua Variable Speed
# Mapping validated on Trevi InnovAqua variable speed over local protocol 3.5.
# The Celsius setpoint (dp2) and inlet water temp (dp3) drive the climate.
# The device also exposes an integer Fahrenheit setpoint (dp25) and inlet
# water temperature (dp26), provided as separate number and sensor entities.
# A Fahrenheit climate (dp25/dp26) was tried, but tuya-local does not create
# the climate entity for it on this device, so Celsius is used for climate.
entities:
  - entity: climate
    translation_key: pool_heatpump
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
            icon: "mdi:hvac-off"
            icon_priority: 1
          - dps_val: true
            value: "heat"
            icon: "mdi:hot-tub"
            icon_priority: 3
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 8
          max: 40
      - id: 3
        name: current_temperature
        type: integer
      - id: 4
        name: preset_mode
        type: string
        mapping:
          - dps_val: heat
            value: smart_heat
          - dps_val: powerful
            value: quick_heat
          - dps_val: silent
            value: quiet_heat
          - dps_val: cool
            value: smart_cool
  - entity: sensor
    name: Water temperature
    category: diagnostic
    dps:
      - id: 26
        name: sensor
        type: integer
        unit: F
        class: measurement
  - entity: number
    name: Set temperature
    category: config
    icon: "mdi:thermometer"
    dps:
      - id: 25
        name: value
        type: integer
        unit: F
        range:
          min: 46
          max: 104
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 17
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 9
        name: sensor
        type: bitfield
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 9
        name: fault_code
        type: bitfield
