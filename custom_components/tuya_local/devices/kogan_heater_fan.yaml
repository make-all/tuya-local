name: Heater fan
entities:
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 3
        type: integer
        name: speed
        range:
          min: 1
          max: 9
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: normal
            value: none
          - dps_val: strong
            value: boost
      - id: 5
        type: boolean
        name: oscillate
  - entity: climate
    translation_key: heater
    dps:
      - id: 1
        type: boolean
        name: available
      - id: 101
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 20
        type: integer
        name: temperature
        range:
          min: 15
          max: 35
        unit: C
      - id: 21
        type: integer
        name: current_temperature
      - id: 102
        type: integer
        name: preset_mode
        mapping:
          - dps_val: 0
            value: low
          - dps_val: 1
            value: medium
          - dps_val: 2
            value: high
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 13
        type: boolean
        name: switch
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 22
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: 1h
            value: 1h
          - dps_val: 2h
            value: 2h
          - dps_val: 3h
            value: 3h
          - dps_val: 4h
            value: 4h
          - dps_val: 5h
            value: 5h
          - dps_val: 6h
            value: 6h
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 23
        type: integer
        name: sensor
        unit: min
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 24
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 24
        type: bitfield
        name: fault_code
