name: Valve controller
products:
  - id: nguto5atyd2xxnap
    model: ARD-100+
  - id: key5ckdnys3pqgec
  - id: keyfxuj3d5wg53wx
entities:
  - entity: valve
    dps:
      - id: 1
        type: boolean
        name: valve
  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 7
        name: second
        type: integer
        range:
          min: 0
          max: 86400
  - entity: select
    translation_key: initial_state
    category: config
    dps:
      - id: 14
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "off"
            value: "off"
          - dps_val: "on"
            value: "on"
          - dps_val: memory
            value: memory
