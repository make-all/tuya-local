name: Thermostat
products:
  - id: iarskv8rllonqsvo
    manufacturer: Coleman-Mach
    model: RVP 9420-391
entities:
  - entity: climate
    translation_key: thermostat
    dps:
      - id: 2
        type: string
        name: hvac_mode
        mapping:
          - dps_val: "auto"
            value: heat_cool
          - dps_val: heat
            value: heat
          - dps_val: cool
            value: cool
          - dps_val: emer
            value: heat
            hidden: true
          - dps_val: "off"
            value: "off"
          - dps_val: auto_heat
            value: heat
            hidden: true
          - dps_val: auto_cool
            value: cool
            hidden: true
      - id: 23
        type: string
        name: temperature_unit
        mapping:
          - dps_val: f
            value: F
          - value: C
      - id: 101
        type: string
        name: preset_mode
        mapping:
          - dps_val: com
            value: comfort
          - dps_val: eco
            value: eco
          - dps_val: sch
            value: program
      - id: 102
        type: string
        name: fan_mode
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: "on"
            value: "on"
          - dps_val: low
            value: low
          - dps_val: med
            value: medium
          - dps_val: high
            value: high
      - id: 131
        type: base64
        optional: true
        mask: "FFFF0000000000000000"
        name: current_temperature
      - id: 103
        type: integer
        name: temperature
        range:
          min: 0
          max: 370
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: c
                scale: 10
                step: 5
                value_redirect: temp_c
              - dps_val: f
                value_redirect: temp_f
      - id: 103
        type: integer
        name: temp_c
        range:
          min: 0
          max: 370
        mapping:
          - scale: 10
            step: 5
            constraint: hvac_mode
            conditions:
              - dps_val: [heat, auto_heat, emer]
                value_redirect: heat_temp_c
                range:
                  min: 0
                  max: 320
      - id: 103
        type: integer
        name: temp_f
        range:
          min: 32
          max: 99
        mapping:
          - constraint: hvac_mode
            conditions:
              - dps_val: [heat, auto_heat, emer]
                value_redirect: heat_temp_f
                range:
                  min: 32
                  max: 90
      - id: 104
        type: integer
        name: heat_temp_c
        mapping:
          - scale: 10
            step: 5
        range:
          min: 0
          max: 320
      - id: 104
        type: integer
        name: heat_temp_f
        range:
          min: 32
          max: 90
      - id: 118
        type: base64
        optional: true
        mask: "00000300"
        name: hvac_action
        mapping:
          - dps_val: 1
            value: cooling
          - dps_val: 2
            value: heating
          - dps_val: 0
            value: idle
          - value: null
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 23
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 27
        type: integer
        name: value
        unit: C
        range:
          min: -45
          max: 45
        mapping:
          - scale: 10
            step: 5
  - entity: button
    translation_key: factory_reset
    category: config
    hidden: true
    dps:
      - id: 39
        type: boolean
        optional: true
        name: button
  - entity: select
    name: Schedule days
    icon: "mdi:calendar-week"
    category: config
    dps:
      - id: 105
        type: string
        name: option
        mapping:
          - dps_val: 7_4
            value: Daily
          - dps_val: 5_2
            value: Weekdays+Weekend
          - dps_val: 5_1_1
            value: Weekdays+Sat+Sun
  - entity: select
    name: System type
    category: config
    dps:
      - id: 106
        type: string
        name: option
        mapping:
          - dps_val: 1H1C_C
            value: 1H1C_C
          - dps_val: 1H1C_HP
            value: 1H1C_HP
          - dps_val: HEAT_NO_FAN_C
            value: HEAT_NO_FAN_C
          - dps_val: HEAT_WITH_FAN_C
            value: HEAT_WITH_FAN_C
          - dps_val: HEAT_VAVLE_C
            value: HEAT_VALVE_C
          - dps_val: COOL_C
            value: COOL_C
          - dps_val: 2H1C_AUX_HP
            value: 2H1C_AUX_HP
          - dps_val: 2H1C_EMER_HP
            value: 2H1C_EMER_HP
          - dps_val: 1H1C_1S_FUEL
            value: 1H1C_1S_FUEL
          - dps_val: 2H2C_C
            value: 2H2C_C
          - dps_val: 2H1C_C
            value: 2H1C_C
          - dps_val: 1H2C_C
            value: 1H2C_C
          - dps_val: 2H2C_HP
            value: 2H2C_HP
          - dps_val: 3H2C_AUX_HP
            value: 3H2C_AUX_HP
          - dps_val: 3H2C_EMER_HP
            value: 3H2C_EMER_HP
          - dps_val: 4H2C_A_E_HP
            value: 4H2C_A_E_HP
          - dps_val: 2H2C_1S_D_FUEL
            value: 2H2C_IS_D_FUEL
          - dps_val: 2H2C_2S_D_FUEL
            value: 2H2C_2S_D_FUEL
          - dps_val: FC_WITH_3
            value: FC_WITH_3
          - dps_val: FC_WITH_3_AC
            value: FC_WITH_3_AC
          - dps_val: FC_WITH_3_ERV
            value: FC_WITH_3_ERV
          - dps_val: FC_WITH_3_E_A
            value: FC_WITH_3_E_A
          - dps_val: 1H1C_HP_WITH_E
            value: 1H1C_HP_WITH_E
          - dps_val: 2H1C_HP_WITH_EA
            value: 2H1C_HP_WITH_EA
          - dps_val: 1H1C_HP_3
            value: 1H1C_HP_3
          - dps_val: 1H1C_C_3
            value: 1H1C_C_3
  - entity: text
    name: ERV mode
    category: config
    icon: "mdi:hvac"
    hidden: true
    dps:
      - id: 107
        type: base64
        optional: true
        name: value
  - entity: text
    translation_key: schedule
    category: config
    hidden: true
    dps:
      - id: 108
        type: base64
        optional: true
        name: value
  - entity: select
    name: Fan type
    icon: "mdi:fan"
    category: config
    dps:
      - id: 109
        type: string
        name: option
        mapping:
          - dps_val: gas_oil
            value: Gas / Oil
          - dps_val: electric
            value: Electric
  - entity: select
    name: Valve direction
    icon: "mdi:valve"
    category: config
    dps:
      - id: 110
