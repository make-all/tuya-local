name: Motorized water valve
products:
  - id: nzx0kku9d6eq59nt
    manufacturer: FrankEver
    name: Smart Water Valve
entities:
  - entity: valve
    class: water
    dps:
      - id: 101
        type: integer
        name: valve
        range:
          min: 0
          max: 100
        mapping:
          - step: 10
      - id: 102
        type: integer
        name: current_position
        range:
          min: 0
          max: 100
      - id: 1
        type: boolean
        name: switch
  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 9
        type: integer
        name: second
        range:
          min: 0
          max: 86400
  - entity: select
    translation_key: initial_state
    category: config
    dps:
      - id: 38
        type: string
        name: option
        mapping:
          - dps_val: "off"
            value: "off"
          - dps_val: "on"
            value: "on"
          - dps_val: memory
            value: memory
