name: Simple dimmer
products:
  - id: fXe'fLR.uFO`E->F
    manufacturer: Liwokit
  - id: g5tdfvf5g4osvagd
    manufacturer: Liwokit
entities:
  - entity: light
    dps:
      - id: 1
        name: switch
        type: boolean
      - id: 2
        name: brightness
        type: integer
        range:
          min: 10
          max: 1000
  - entity: light
    translation_key: backlight
    category: config
    dps:
      - id: 16
        type: boolean
        name: switch
  - entity: select
    translation_key: light_mode
    category: config
    dps:
      - id: 15
        type: string
        name: option
        mapping:
          - dps_val: relay
            value: state
          - dps_val: pos
            value: locator
          - dps_val: none
            value: "off"
