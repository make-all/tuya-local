name: Quad switch
products:
  - id: mwiiltjyanw48oxm
    manufacturer: Moes
    model: MS-104D
  - id: ailtrfobq95yw5ls
    manufacturer: Avatto
    model: WSMD-4
entities:
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "1"
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 44
        type: string
        optional: true
        name: inching
      - id: 48
        type: string
        name: interlock
        optional: true
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "2"
    dps:
      - id: 2
        type: boolean
        name: switch
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "3"
    dps:
      - id: 3
        type: boolean
        name: switch
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "4"
    dps:
      - id: 4
        type: boolean
        name: switch
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "1"
    dps:
      - id: 9
        type: integer
        name: second
        range:
          min: 0
          max: 86399
      - id: 42
        type: string
        optional: true
        name: random_timer
      - id: 43
        optional: true
        type: string
        name: cycle_timer
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "2"
    dps:
      - id: 10
        type: integer
        name: second
        range:
          min: 0
          max: 86399
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "3"
    dps:
      - id: 11
        type: integer
        name: second
        range:
          min: 0
          max: 86399
  - entity: time
    category: config
    translation_key: timer_x
    translation_placeholders:
      x: "4"
    dps:
      - id: 12
        type: integer
        name: second
        range:
          min: 0
          max: 86399
  - entity: select
    translation_key: initial_state
    category: config
    dps:
      - id: 38
        type: string
        name: option
        mapping:
          - dps_val: "off"
            value: "off"
            available: standard
          - dps_val: "on"
            value: "on"
            available: standard
          - dps_val: memory
            value: memory
            available: standard
          - dps_val: "0"
            value: "off"
            available: numeric
          - dps_val: "1"
            value: "on"
            available: numeric
          - dps_val: "2"
            value: memory
            available: numeric
          - dps_val: power_off
            value: "off"
            available: power
          - dps_val: power_on
            value: "on"
            available: power
          - dps_val: last
            value: memory
            available: power
      - id: 38
        type: string
        name: standard
        mapping:
          - conditions:
              - dps_val: ["on", "off", memory]
                value: true
            value: false
      - id: 38
        type: string
        name: numeric
        mapping:
          - conditions:
              - dps_val: ["0", "1", "2"]
                value: true
            value: false
      - id: 38
        type: string
        name: power
        mapping:
          - conditions:
              - dps_val: [power_off, power_on, last]
                value: true
            value: false
  - entity: select
    name: Switch type
    icon: "mdi:toggle-switch"
    category: config
    dps:
      - id: 47
        type: string
        name: option
        mapping:
          - dps_val: flip
            value: Flip
          - dps_val: sync
            value: Synchronised
          - dps_val: button
            value: Button
