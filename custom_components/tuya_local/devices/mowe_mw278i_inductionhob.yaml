name: Induction hob
products:
  - id: i6qpkzm123tvw3a2
    manufacturer: Mowe
    model: MW278I
entities:
  - entity: switch
    icon: "mdi:gas-burner"
    dps:
      - id: 101
        name: switch
        type: boolean
  - entity: select
    name: Burner
    icon: "mdi:left-right-bold"
    dps:
      - id: 102
        name: option
        type: string
        mapping:
          - dps_val: "0"
            value: Left
          - dps_val: "1"
            value: Right
  - entity: number
    name: Burner power
    dps:
      - id: 103
        name: value
        type: string
        range:
          min: 0
          max: 9
        mapping:
          - dps_val: "0"
            value: 0
            icon: "mdi:signal-cellular-outline"
          - dps_val: "1"
            value: 1
            icon: "mdi:signal-cellular-1"
          - dps_val: "2"
            value: 2
            icon: "mdi:signal-cellular-1"
          - dps_val: "3"
            value: 3
            icon: "mdi:signal-cellular-1"
          - dps_val: "4"
            value: 4
            icon: "mdi:signal-cellular-2"
          - dps_val: "5"
            value: 5
            icon: "mdi:signal-cellular-2"
          - dps_val: "6"
            value: 6
            icon: "mdi:signal-cellular-2"
          - dps_val: "7"
            value: 7
            icon: "mdi:signal-cellular-3"
          - dps_val: "8"
            value: 8
            icon: "mdi:signal-cellular-3"
          - dps_val: "9"
            value: 9
            icon: "mdi:signal-cellular-3"
  - entity: switch
    name: Boost
    icon: "mdi:rocket-launch"
    dps:
      - id: 104
        name: switch
        type: boolean
  - entity: switch
    name: Keep warm
    icon: "mdi:heat-wave"
    dps:
      - id: 105
        name: switch
        type: boolean
  - entity: switch
    name: Pause
    icon: "mdi:pause"
    dps:
      - id: 106
        name: switch
        type: boolean
  - entity: number
    translation_key: timer
    dps:
      - id: 107
        name: value
        unit: min
        type: integer
        range:
          min: 0
          max: 99
  - entity: sensor
    name: Total usage
    class: duration
    dps:
      - id: 110
        name: sensor
        unit: h
        type: integer
        mapping:
          - scale: 100
  - entity: sensor
    class: energy
    dps:
      - id: 111
        name: sensor
        unit: kWh
        type: integer
        class: total_increasing
        mapping:
          - scale: 100
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 120
        name: sensor
        type: string
        mapping:
          - dps_val: "0"
            value: false
          - value: true
      - id: 120
        name: fault_code
        type: string
      - id: 120
        name: description
        type: string
        mapping:
          - dps_val: "0"
            value: "OK"
          - dps_val: "5"
            value: No pot on stove
          - dps_val: "6"
            value: Hot surface
          - value: Unknown
