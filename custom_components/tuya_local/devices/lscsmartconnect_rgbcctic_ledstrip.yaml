name: Light strip
products:
  - id: a5mzajl6cinrnfwi
    manufacturer: LSC Smart Connect
    model: RGB/IC + CCT/IC Smart LED Strip 3m
entities:
  - entity: light
    dps:
      - id: 20
        type: boolean
        name: switch
      - id: 21
        name: color_mode
        type: string
        mapping:
          - dps_val: white
            value: color_temp
          - dps_val: colour
            value: hs
          - dps_val: scene
            value: Scene
          - dps_val: music
            value: Music
      - id: 22
        name: brightness
        type: integer
        range:
          min: 10
          max: 1000
      - id: 23
        name: color_temp
        type: integer
        range:
          min: 0
          max: 1000
        mapping:
          - target_range:
              min: 2700
              max: 6500
      - id: 24
        name: rgbhsv
        type: hex
        format:
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 0
              max: 1000
  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 26
        type: integer
        name: second
        range:
          min: 0
          max: 86399
  - entity: text
    name: Music
    category: config
    icon: "mdi:music"
    hidden: true
    dps:
      - id: 27
        type: string
        optional: true
        name: value
  - entity: text
    name: Dreamlight music
    category: config
    icon: "mdi:music"
    hidden: true
    dps:
      - id: 52
        type: base64
        optional: true
        name: value
  - entity: text
    name: Power memory
    category: config
    icon: "mdi:cogs"
    hidden: true
    dps:
      - id: 101
        type: base64
        optional: true
        name: value
  - entity: text
    translation_key: scene
    category: config
    hidden: true
    dps:
      - id: 102
        type: base64
        optional: true
        name: value
  - entity: text
    name: Paint
    category: config
    icon: "mdi:palette"
    hidden: true
    dps:
      - id: 103
        type: base64
        optional: true
        name: value
