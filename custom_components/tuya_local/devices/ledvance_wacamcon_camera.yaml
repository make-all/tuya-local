name: PTZ floodlight camera
products:
  - id: derumwjnpzfopvn0
    manufacturer: LEDVANCE
    model: Wifi SMART+ WALL CAMERA CONTROL
    model_id: "4099854474972"
entities:
  - entity: light
    name: Floodlight
    dps:
      - id: 138
        type: boolean
        name: switch
      - id: 158
        type: integer
        name: brightness
        optional: true
        range:
          min: 1
          max: 100
  - entity: switch
    name: Siren
    category: config
    dps:
      - id: 159
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: false
            hidden: true
  - entity: switch
    translation_key: motion_detection
    category: config
    dps:
      - id: 134
        type: boolean
        name: switch
  - entity: event
    class: motion
    dps:
      - id: 115
        type: base64
        name: event
        optional: true
        mapping:
          - dps_val: null
            value: null
          - value: detected
  - entity: select
    translation_key: motion_sensitivity
    category: config
    dps:
      - id: 106
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "0"
            value: low
          - dps_val: "1"
            value: medium
          - dps_val: "2"
            value: high
  - entity: button
    name: PTZ stop
    category: config
    dps:
      - id: 116
        type: boolean
        name: button
        optional: true
  - entity: button
    name: PTZ up
    category: config
    dps:
      - id: 119
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: "0"
            value: true
          - value: false
  - entity: button
    name: PTZ right-up
    category: config
    dps:
      - id: 119
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: "1"
            value: true
          - value: false
  - entity: button
    name: PTZ right
    category: config
    dps:
      - id: 119
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: "2"
            value: true
          - value: false
  - entity: button
    name: PTZ right-down
    category: config
    dps:
      - id: 119
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: "3"
            value: true
          - value: false
  - entity: button
    name: PTZ down
    category: config
    dps:
      - id: 119
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: "4"
            value: true
          - value: false
  - entity: button
    name: PTZ left-down
    category: config
    dps:
      - id: 119
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: "5"
            value: true
          - value: false
  - entity: button
    name: PTZ left
    category: config
    dps:
      - id: 119
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: "6"
            value: true
          - value: false
  - entity: button
    name: PTZ left-up
    category: config
    dps:
      - id: 119
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: "7"
            value: true
          - value: false
  - entity: switch
    translation_key: flip_image
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: switch
    translation_key: watermark
    category: config
    dps:
      - id: 104
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: false
            hidden: true
  - entity: switch
    name: Status LED
    category: config
    dps:
      - id: 101
        type: boolean
        name: switch
        optional: true
  - entity: select
    translation_key: night_vision
    category: config
    dps:
      - id: 108
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "0"
            value: auto
          - dps_val: "1"
            value: "off"
          - dps_val: "2"
            value: "on"
  - entity: sensor
    class: enum
    translation_key: sd_status
    category: diagnostic
    dps:
      - id: 110
        type: integer
        name: sensor
        optional: true
        mapping:
          - dps_val: 1
            value: normal
          - dps_val: 2
            value: fault
          - dps_val: 3
            value: full
          - dps_val: 4
            value: formatting
          - dps_val: 5
            value: missing
          - dps_val: null
            value: normal
            hidden: true
      - id: 109
        type: string
        name: capacity
        optional: true
  - entity: button
    name: SD format
    category: config
    dps:
      - id: 111
        type: boolean
        name: button
        optional: true
        persist: false
      - id: 117
        type: integer
        name: status
        optional: true
        persist: false
        mapping:
          - dps_val: 0
            value: Formatted
          - dps_val: 100
            value: Formatted
          - dps_val: 2000
            value: Formatting
          - dps_val: 2001
            value: Format error
          - dps_val: 2002
            value: No SD card
          - dps_val: 2003
            value: Card error
  - entity: switch
    translation_key: camera_record
    category: config
    dps:
      - id: 150
        type: boolean
        name: switch
        optional: true
  - entity: select
    translation_key: recording_mode
    category: config
    dps:
      - id: 151
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "1"
            value: event
          - dps_val: "2"
            value: continuous
  - entity: select
    name: PIR sensitivity
    category: config
    dps:
      - id: 152
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "0"
            value: "off"
          - dps_val: "1"
            value: low
          - dps_val: "2"
            value: medium
          - dps_val: "3"
            value: high
  - entity: sensor
    name: PIR lux threshold
    category: diagnostic
    dps:
      - id: 231
        type: integer
        name: sensor
        unit: lx
        class: measurement
        optional: true
  - entity: select
    name: PIR light duration
    category: config
    dps:
      - id: 232
        type: integer
        name: option
        optional: true
        mapping:
          - dps_val: 5
            value: "5s"
          - dps_val: 10
            value: "10s"
          - dps_val: 30
            value: "30s"
          - dps_val: 60
            value: "60s"
          - dps_val: 120
            value: "120s"
          - dps_val: 360
            value: "360s"
