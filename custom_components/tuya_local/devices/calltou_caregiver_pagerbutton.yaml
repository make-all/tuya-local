name: Call button
products:
  - id: vanmjedglfmi3ae8
    manufacturer: CallToU
    model: Caregiver Pager
entities:
  - entity: text
    name: Button data
    category: config
    icon: "mdi:cogs"
    hidden: true
    dps:
      - id: 1
        type: base64
        optional: true
        name: value
  - entity: siren
    name: Alarm
    dps:
      - id: 2
        type: integer
        name: tone
        mapping:
          - dps_val: 1
            value: Tone 1
          - dps_val: 2
            value: Tone 2
          - dps_val: 3
            value: Tone 3
          - dps_val: 4
            value: Tone 4
          - dps_val: 5
            value: Tone 5
          - dps_val: 6
            value: Tone 6
          - dps_val: 7
            value: Tone 7
          - dps_val: 8
            value: Tone 8
          - dps_val: 9
            value: Tone 9
          - dps_val: 10
            value: Tone 10
      - id: 3
        type: integer
        name: volume_level
        range:
          min: 0
          max: 4
        mapping:
          - scale: 4
  - entity: event
    translation_key: alarm
    dps:
      - id: 5
        type: utf16b64
        name: event
        optional: true
        mapping:
          - dps_val: null
            value: null
          - value: alert
      - id: 5
        type: utf16b64
        optional: true
        name: message
      - id: 102
        type: integer
        optional: true
        name: device_id
      - id: 104
        type: string
        optional: true
        name: device_name
      - id: 106
        type: integer
        optional: true
        name: alarm_id
      - id: 107
        type: string
        optional: true
        name: log_message
  - entity: text
    name: Do not disturb settings
    category: config
    icon: "mdi:sleep"
    hidden: true
    dps:
      - id: 7
        type: base64
        optional: true
        name: value
  - entity: button
    name: Mute
    category: config
    dps:
      - id: 101
        type: boolean
        optional: true
        name: button
  - entity: binary_sensor
    name: Alarm
    class: sound
    category: diagnostic
    dps:
      - id: 102
        type: integer
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 102
        type: integer
        optional: true
        name: device_id
      - id: 104
        type: string
        optional: true
        name: device_name
      - id: 106
        type: integer
        optional: true
        name: alarm_id
      - id: 107
        type: string
        optional: true
        name: log_message
  - entity: sensor
    class: signal_strength
    category: diagnostic
    dps:
      - id: 103
        type: integer
        optional: true
        name: sensor
        unit: dBm
