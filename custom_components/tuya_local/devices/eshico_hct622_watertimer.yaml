name: Water timer
products:
  - id: q8tpmjtw
    manufacturer: Eshico
    model: HCT-622-HCG-002
entities:
  - entity: valve
    class: water
    dps:
      - id: 1
        type: boolean
        name: valve
  - entity: number
    translation_key: timer
    category: config
    dps:
      - id: 17
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 3599
      - id: 107
        type: base64
        optional: true
        name: next
  - entity: text
    translation_key: schedule
    category: config
    hidden: true
    dps:
      - id: 38
        type: base64
        optional: true
        name: value
  - entity: text
    name: Cycle timer
    translation_key: schedule
    category: config
    hidden: true
    dps:
      - id: 39
        type: base64
        optional: true
        name: value
  - entity: sensor
    name: Weather delay remaining
    class: duration
    icon: "mdi:weather-cloudy-clock"
    category: diagnostic
    dps:
      - id: 42
        type: integer
        name: sensor
        unit: h
  - entity: switch
    name: Use weather
    category: config
    icon: "mdi:weather-cloudy"
    dps:
      - id: 43
        type: boolean
        name: switch
  - entity: select
    name: Weather
    category: config
    dps:
      - id: 44
        type: string
        name: option
        mapping:
          - dps_val: sunny
            value: sunny
            icon: "mdi:weather-sunny"
          - dps_val: rainy
            value: rainy
            icon: "mdi:weather-pouring"
  - entity: select
    name: Weather delay
    translation_key: timer
    category: config
    icon: "mdi:weather-cloudy-clock"
    dps:
      - id: 45
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1"
            value: "1d"
          - dps_val: "2"
            value: "2d"
          - dps_val: "3"
            value: "3d"
          - dps_val: "4"
            value: "4d"
          - dps_val: "5"
            value: "5d"
          - dps_val: "6"
            value: "6d"
          - dps_val: "7"
            value: "7d"
  - entity: sensor
    class: battery
    category: diagnostic
    dps:
      - id: 47
        type: string
        name: sensor
        unit: "%"
        class: measurement
        mapping:
          - dps_val: "6"
            value: 100
          - dps_val: "5"
            value: 80
          - dps_val: "4"
            value: 60
          - dps_val: "3"
            value: 40
          - dps_val: "2"
            value: 20
          - dps_val: "1"
            value: 0
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 53
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 53
        type: bitfield
        name: fault_code
  - entity: sensor
    name: Last runtime
    class: duration
    category: diagnostic
    dps:
      - id: 101
        type: integer
        name: sensor
        unit: s
        class: measurement
  - entity: sensor
    class: duration
    category: diagnostic
    dps:
      - id: 103
        type: integer
        name: sensor
        unit: s
        class: measurement
  - entity: sensor
    translation_key: status
    class: enum
    category: diagnostic
    dps:
      - id: 105
        type: string
        name: sensor
        mapping:
          - dps_val: manual
            value: manual
          - dps_val: timing
            value: scheduled
          - dps_val: spray
            value: working
          - dps_val: idle
            value: idle
