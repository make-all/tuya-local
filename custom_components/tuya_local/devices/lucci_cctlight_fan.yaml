name: Ceiling fan
products:
  - id: mipcgdnh7tlckmrn
    manufacturer: Lucci
    model: Air Radar Connect
entities:
  - entity: fan
    translation_key: fan_with_presets
    dps:
      - id: 60
        type: boolean
        name: switch
      - id: 61
        type: string
        name: preset_mode
        mapping:
          - dps_val: nature
            value: nature
          - dps_val: fresh
            value: fresh
      - id: 62
        type: integer
        name: speed
        range:
          min: 1
          max: 6
      - id: 63
        type: string
        name: direction
  - entity: light
    dps:
      - id: 20
        type: boolean
        name: switch
      - id: 22
        name: brightness
        type: integer
        range:
          min: 1
          max: 100
      - id: 23
        name: color_temp
        type: integer
        range:
          min: 0
          max: 100
        mapping:
          - target_range:
              min: 3000
              max: 5000
  - entity: number
    name: Light timer
    category: config
    class: duration
    dps:
      - id: 26
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 64800
  - entity: number
    name: Fan timer
    category: config
    dps:
      - id: 64
        type: integer
        name: value
        unit: min
        range:
          min: 0
          max: 540
  - entity: text
    name: Light control
    category: config
    icon: "mdi:cogs"
    hidden: true
    dps:
      - id: 28
        type: string
        optional: true
        name: value
