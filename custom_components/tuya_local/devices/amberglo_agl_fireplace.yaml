name: Fireplace
products:
  - id: shda8a5asyk244yw
    manufacturer: Amberglo
    model: Slimline Media Wall Fireplace
    model_id: WL914-BW
entities:
  - entity: switch
    name: Power
    dps:
      - id: 1
        name: switch
        type: boolean
  - entity: climate
    translation_key: heater
    dps:
      - id: 4
        name: hvac_mode
        type: string
        mapping:
          - dps_val: Force_OFF
            value: "off"
          - dps_val: Force_ON
            value: heat
          - dps_val: temperature_control
            value: auto
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 15
          max: 37
      - id: 3
        name: current_temperature
        type: integer
  - entity: switch
    name: Open window detection
    category: config
    dps:
      - id: 104
        name: switch
        type: boolean
  - entity: light
    translation_key: flame
    dps:
      - id: 105
        name: brightness
        type: integer
        range:
          min: 0
          max: 5
      - id: 101
        name: effect
        type: string
        mapping:
          - dps_val: 0
            value: Orange
          - dps_val: 1
            value: Red
          - dps_val: 2
            value: Blue
          - dps_val: 3
            value: Green
          - dps_val: 4
            value: Red and blue
          - dps_val: 5
            value: Red and green
          - dps_val: 6
            value: Blue and orange
          - dps_val: 7
            value: Red, orange and blue
          - dps_val: 8
            value: Red, orange, blue and green
          - dps_val: 9
            value: Red and orange
  - entity: select
    name: Fuel bed
    dps:
      - id: 102
        name: option
        type: string
        mapping:
          - dps_val: 0
            value: "Off"
          - dps_val: 1
            value: Green
          - dps_val: 2
            value: Red
          - dps_val: 3
            value: Blue
          - dps_val: 4
            value: Lime
          - dps_val: 5
            value: Cyan
          - dps_val: 6
            value: Pink
          - dps_val: 7
            value: Warm white
          - dps_val: 8
            value: Light blue
          - dps_val: 9
            value: Magenta
          - dps_val: 10
            value: Cool white
