name: Roller shade
products:
  - id: 68nvbio9
    manufacturer: Zemismart
    model: ZM25EL
entities:
  - entity: cover
    class: shade
    dps:
      - id: 1
        name: control
        type: string
        mapping:
          - dps_val: open
            value: open
          - dps_val: close
            value: close
          - dps_val: stop
            value: stop
          - dps_val: continue
            value: continue
      - id: 2
        name: position
        type: integer
        optional: true
        range:
          min: 0
          max: 100
      - id: 3
        name: current_position
        type: integer
        range:
          min: 0
          max: 100
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 12
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 12
        name: fault_code
        type: bitfield
        optional: true
  - entity: select
    name: Click control
    icon: "mdi:theme-light-dark"
    category: config
    dps:
      - id: 20
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: continuous
            value: Continuous
          - dps_val: Intermittently
            value: Intermittent
  - entity: sensor
    class: battery
    category: diagnostic
    dps:
      - id: 13
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: binary_sensor
    name: State
    class: opening
    dps:
      - id: 3
        type: integer
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
