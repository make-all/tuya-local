name: Pool pump
legacy_type: aquaforte_vsp_poolpump
products:
  - id: ircs2n82vgrozoew
    manufacturer: Madimack
    model: Inverflow Pro P300i
  - id: i0elff0w1pehctax
    manufacturer: AquaForte
    model: Inverter VSP
  - id: skbzchwjmnf8vmm4
    manufacturer: Aquagem
    model: Inverpro v20230816
entities:
  - entity: valve
    class: water
    dps:
      - id: 105
        type: boolean
        name: valve
      - id: 116
        name: unknown_116
        optional: true
        type: string
      - id: 117
        name: unknown_117
        type: string
        optional: true
      - id: 115
        name: unknown_115
        type: boolean
        optional: true
  - entity: select
    name: Pump mode
    icon: "mdi:pump"
    category: config
    dps:
      - id: 103
        type: string
        name: option
        mapping:
          - dps_val: "MI"
            value: "Manual"
          - dps_val: "AI"
            value: "AI Flow"
            available: aiflow_available
          - dps_val: "backwash"
            value: "Boost"
      - id: 102
        type: integer
        optional: true
        name: aiflow_available
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: select
    name: Pump flow units
    category: config
    hidden: unavailable
    dps:
      - id: 110
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: "m3_h"
            value: "m³/h"
          - dps_val: "l_min"
            value: "L/min"
          - dps_val: "us_gpm"
            value: "US gpm"
          - dps_val: "ipm_gpm"
            value: "Imperial gpm"
      - id: 110
        type: string
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: number
    name: Boost timer
    translation_key: timer
    class: duration
    category: config
    mode: box
    dps:
      - id: 104
        type: integer
        name: value
        range:
          min: 0
          max: 1500
        unit: s
  - entity: number
    name: AI flow rate
    class: volume_flow_rate
    category: config
    mode: slider
    hidden: unavailable
    dps:
      - id: 106
        type: integer
        optional: true
        name: value
        range:
          min: 0
          max: 1000
      - id: 101
        type: integer
        optional: true
        name: maximum
      - id: 107
        type: integer
        optional: true
        name: minimum
      - id: 113
        type: integer
        optional: true
        name: step
      - id: 110
        type: string
        optional: true
        name: unit
        mapping:
          - dps_val: "m3_h"
            value: "m³/h"
          - dps_val: "l_min"
            value: "L/min"
          - dps_val: "us_gpm"
            value: "gal/min"
          - dps_val: "ipm_gpm"
            value: "gal/min"
      - id: 110
        type: string
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: number
    name: Manual percentage power
    category: config
    mode: slider
    dps:
      - id: 111
        type: integer
        name: value
        range:
          min: 30
          max: 120
        mapping:
          - step: 5
        unit: "%"
  - entity: sensor
    name: Boost time remaining
    class: duration
    category: diagnostic
    dps:
      - id: 108
        type: integer
        name: sensor
        unit: s
  - entity: sensor
    class: power
    dps:
      - id: 5
        type: integer
        name: sensor
        unit: W
        class: measurement
  - entity: sensor
    class: volume_flow_rate
    hidden: unavailable
    dps:
      - id: 112
        type: integer
        optional: true
        name: sensor
        class: measurement
      - id: 110
        type: string
        optional: true
        name: unit
        mapping:
          - dps_val: "m3_h"
            value: "m³/h"
          - dps_val: "l_min"
            value: "L/min"
          - dps_val: "us_gpm"
            value: "gal/min"
          - dps_val: "ipm_gpm"
            value: "gal/min"
      - id: 110
        type: string
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    class: energy
    category: diagnostic
    dps:
      - id: 109
        type: integer
        name: sensor
        class: total_increasing
        unit: kWh
        mapping:
          - scale: 100
  - entity: sensor
    name: Actual pump speed
    category: diagnostic
    hidden: unavailable
    dps:
      - id: 102
        type: integer
        optional: true
        name: sensor
        unit: "%"
        range:
          min: 30
          max: 120
      - id: 102
        type: integer
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: binary_sensor
    category: diagnostic
    class: problem
    dps:
      - id: 2
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 2
        type: bitfield
        name: fault_code
  - entity: binary_sensor
    name: Flow pressure warning
    category: diagnostic
    class: problem
    hidden: unavailable
    dps:
      - id: 114
        type: boolean
        optional: true
        name: sensor
      - id: 114
        type: boolean
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
