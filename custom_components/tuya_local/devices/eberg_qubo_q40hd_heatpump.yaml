name: Portable heat pump
products:
  - id: 5wdhsph4zwselcvh
    manufacturer: Warmtec
    model: Morso+
    model_id: KP40W
entities:
  - entity: climate
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: cold
                value: cool
              - dps_val: hot
                value: heat
                available: heating_available
              - dps_val: dehumidify
                value: dry
      - id: 2
        name: temperature
        type: integer
        range:
          min: 17
          max: 30
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                range:
                  min: 63
                  max: 86
      - id: 3
        name: current_temperature
        type: integer
      - id: 4
        name: mode
        type: string
        hidden: true
      - id: 5
        name: fan_mode
        type: string
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: low
            value: low
          - dps_val: middle
            value: medium
          - dps_val: high
            value: high
      - id: 19
        name: temperature_unit
        type: string
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 25
        type: boolean
        name: preset_mode
        mapping:
          - dps_val: true
            value: sleep
          - dps_val: false
            value: comfort
      - id: 30
        type: boolean
        name: swing_mode
        mapping:
          - dps_val: true
            value: "on"
          - dps_val: false
            value: "off"
      - id: 6
        type: string
        optional: true
        name: hvac_action
        mapping:
          - dps_val: heating
            value: heating
          - dps_val: cooling
            value: cooling
          - dps_val: ventilation
            value: fan
          - dps_val: "off"
            value: idle
          - dps_val: wet
            value: drying
          - value: null
      - id: 101
        name: heating_available
        type: string
        hidden: true
        # mappings based on dev portal info and observed values
        mapping:
          - dps_val: heat_s
            value: true
          - value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 22
        type: bitfield
        name: fault_code
