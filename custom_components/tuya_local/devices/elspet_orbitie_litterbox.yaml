name: Cat litter box
products:
  - id: nbkqubgxxmanacsv
    manufacturer: Elspet
    model: Orbitie
entities:
  - entity: sensor
    translation_key: status
    category: diagnostic
    class: enum
    dps:
      - id: 109
        type: string
        name: sensor
        mapping:
          - dps_val: satnd_by
            value: standby
          - dps_val: caking
            value: caking
          - dps_val: cleaning
            value: cleaning
          - dps_val: sleeping
            value: sleep
          - dps_val: UV
            value: sterilizing
  - entity: button
    name: Manual clean
    category: config
    icon: "mdi:shimmer"
    dps:
      - id: 107
        type: boolean
        name: button
  - entity: number
    name: Clean delay
    category: config
    translation_key: timer
    class: duration
    dps:
      - id: 101
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 1800
  - entity: light
    translation_key: indicator
    category: config
    dps:
      - id: 116
        type: boolean
        name: switch
  - entity: switch
    category: config
    translation_key: sound
    dps:
      - id: 117
        type: boolean
        name: switch
  - entity: switch
    name: Kitten mode
    icon: "mdi:cat"
    category: config
    dps:
      - id: 111
        type: boolean
        name: switch
  - entity: switch
    name: Automatic homing
    category: config
    icon: "mdi:refresh-auto"
    dps:
      - id: 119
        type: boolean
        name: switch
  - entity: switch
    translation_key: sleep
    category: config
    dps:
      - id: 102
        type: boolean
        name: switch
  - entity: time
    name: Sleep start
    category: config
    dps:
      - id: 103
        type: integer
        name: minute
        range:
          min: 0
          max: 1440
  - entity: time
    name: Sleep end
    category: config
    dps:
      - id: 104
        type: integer
        name: minute
        range:
          min: 0
          max: 1440
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 114
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 118
        type: bitfield
        name: fault_code
      - id: 118
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: stuck
          - dps_val: 2
            value: dislocation
  - entity: sensor
    name: Clean count
    icon: "mdi:counter"
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
  - entity: sensor
    name: Litter
    icon: mdi:tray
    category: diagnostic
    class: enum
    dps:
      - id: 112
        type: string
        name: sensor
        mapping:
          - dps_val: full
            icon: "mdi:tray-full"
            value: Full
          - dps_val: half
            icon: "mdi:tray-minus"
            value: Half
          - dps_val: empty
            icon: "mdi:tray"
            value: Empty
  - entity: button
    name: Reset litter
    icon: "mdi:delete-empty"
    category: config
    dps:
      - id: 113
        type: boolean
        name: button
  - entity: button
    translation_key: factory_reset
    hidden: true
    category: config
    dps:
      - id: 115
        type: boolean
        name: button
