name: Multi-tariff energy meter
products:
  - id: opdhepy0p7eyeurz
    manufacturer: Xoca
    model: DAC-2121C BI
  - id: kvnopv9brskkod3i
    manufacturer: Xoca
    model: DAC-7321C BI
entities:
  - entity: switch
    icon: "mdi:fuse"
    dps:
      - id: 16
        name: switch
        type: boolean
      - id: 18
        type: string
        name: meter_id
        optional: true
  - entity: sensor
    translation_key: energy_consumed
    class: energy
    dps:
      - id: 1
        type: integer
        unit: kWh
        class: total_increasing
        force: true
        name: sensor
        mapping:
          - scale: 100
  - entity: sensor
    translation_key: energy_produced
    class: energy
    dps:
      - id: 2
        type: integer
        unit: kWh
        class: total_increasing
        force: true
        name: sensor
        mapping:
          - scale: 100
  - entity: sensor
    class: voltage
    category: diagnostic
    deprecated: sensor.voltage_a  # 2026-09-26
    dps:
      - id: 6
        optional: true
        force: true
        type: base64
        unit: V
        class: measurement
        name: sensor
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    deprecated: sensor.current_a  # 2026-09-26
    category: diagnostic
    dps:
      - id: 6
        optional: true
        force: true
        type: base64
        unit: A
        name: sensor
        mask: "0000FFFFFF000000"
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: voltage
    translation_key: voltage_x
    translation_placeholders:
      x: A
    dps:
      - id: 6
        optional: true
        force: true
        type: base64
        unit: V
        class: measurement
        name: sensor
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    translation_key: current_x
    translation_placeholders:
      x: A
    dps:
      - id: 6
        optional: true
        force: true
        type: base64
        unit: A
        name: sensor
        mask: "0000FFFFFF000000"
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    translation_key: power_x
    translation_placeholders:
      x: A
    dps:
      - id: 6
        optional: true
        force: true
        type: base64
        unit: kW
        name: sensor
        mask: "0000000000FFFFFF"
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: voltage
    translation_key: voltage_x
    translation_placeholders:
      x: B
    hidden: true  # not supported on single phase devices
    dps:
      - id: 7
        optional: true
        force: true
        type: base64
        unit: V
        class: measurement
        name: sensor
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    translation_key: current_x
    translation_placeholders:
      x: B
    hidden: true  # not supported on single phase devices
    dps:
      - id: 7
        optional: true
        force: true
        type: base64
        unit: A
        name: sensor
        mask: "0000FFFFFF000000"
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    translation_key: power_x
    translation_placeholders:
      x: B
    hidden: true  # not supported on single phase devices
    dps:
      - id: 7
        optional: true
        force: true
        type: base64
        unit: kW
        name: sensor
        mask: "0000000000FFFFFF"
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: voltage
    translation_key: voltage_x
    translation_placeholders:
      x: C
    category: diagnostic
    hidden: true  # not supported on single phase devices
    dps:
      - id: 8
        optional: true
        force: true
        type: base64
        unit: V
        class: measurement
        name: sensor
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    translation_key: current_x
    translation_placeholders:
      x: C
    hidden: true  # not supported on single phase devices
    dps:
      - id: 8
        optional: true
        force: true
        type: base64
        unit: A
        name: sensor
        mask: "0000FFFFFF000000"
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    translation_key: power_x
    translation_placeholders:
      x: C
    hidden: true  # not supported on single phase devices
    dps:
      - id: 8
        optional: true
        force: true
        type: base64
        unit: kW
        name: sensor
        mask: "0000000000FFFFFF"
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    category: diagnostic
    dps:
      - id: 9
        optional: true
        type: integer
        unit: kW
        name: sensor
        class: measurement
        mapping:
          - scale: 1000
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 10
        type: bitfield
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 10
        type: bitfield
        optional: true
        name: fault_code
  - entity: text
    name: Monthly energy
    category: config
    icon: "mdi:home-lightning-bolt-outline"
    hidden: true
    dps:
      - id: 3
        type: base64
        optional: true
        name: value
  - entity: text
    name: Daily energy
    category: config
    icon: "mdi:home-lightning-bolt-outline"
    hidden: true
    dps:
      - id: 4
        type: base64
        optional: true
        name: value
  - entity: text
    name: Calendar rollover settings
    category: config
    icon: "mdi:cogs"
    hidden: true
    dps:
      - id: 11
        type: base64
        optional: true
        name: value
  - entity: text
    name: Alarm settings
    category: config
    icon: "mdi:alarm"
    hidden: true
    dps:
      - id: 17
        type: base64
        optional: true
        name: value
  - entity: sensor
    # Night zone
    name: Tariff 1
    class: energy
    dps:
      - id: 21
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        optional: true
        force: true
        mapping:
          - scale: 100
  - entity: sensor
    # Day zone
    name: Tariff 2
    class: energy
    dps:
      - id: 22
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        optional: true
        force: true
        mapping:
          - scale: 100
  - entity: sensor
    name: Tariff 3
    class: energy
    dps:
      - id: 23
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        optional: true
        force: true
        mapping:
          - scale: 100
  - entity: sensor
    name: Tariff 4
    class: energy
    dps:
      - id: 24
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        optional: true
        force: true
        mapping:
          - scale: 100
  - entity: button
    name: Clear events
    category: config
    dps:
      - id: 20
        type: boolean
        optional: true
        name: button
