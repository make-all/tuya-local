      - id: 93
        type: string
        optional: true
        sensitive: true
        name: value
  - entity: button
    name: Alexa disconnect
    category: config
    icon: "mdi:cloud-remove"
    hidden: true
    dps:
      - id: 98
        type: boolean
        optional: true
        name: button
  - entity: select
    name: Alexa language
    translation_key: language
    category: config
    hidden: true
    dps:
      - id: 99
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: english_au
            value: english_au
          - dps_val: english_ca
            value: english_ca
          - dps_val: english_in
            value: english_in
          - dps_val: english_uk
            value: english
          - dps_val: english_us
            value: english_us
          - dps_val: french_ca
            value: french_ca
          - dps_val: french_fr
            value: french
          - dps_val: german_de
            value: german
          - dps_val: hindi_in
            value: hindi
          - dps_val: italian_it
            value: italian
          - dps_val: japanese_jp
            value: japanese
          - dps_val: portuguese_br
            value: portuguese
          - dps_val: spanish_es
            value: spanish
          - dps_val: spanish_mx
            value: latin
          - dps_val: spanish_us
            value: spanish_us
  - entity: remote
    dps:
      - id: 201
        name: send
        type: string
        optional: true
      - id: 202
        name: receive
        type: string
        optional: true
        persist: false
  - entity: infrared
    dps:
      - id: 201
        type: string
        optional: true
        name: send
  - entity: number
    name: Voice volume
    category: config
    translation_key: volume
    dps:
      - id: 203
        type: integer
        name: value
        unit: "%"
        range:
          min: 0
          max: 100
  - entity: switch
    name: Voice mic
    icon: "mdi:microphone"
    category: config
    dps:
      - id: 204
        type: boolean
        optional: true
        name: switch
  - entity: switch
    name: Voice play
    category: config
    dps:
      - id: 205
        type: boolean
        name: switch
        mapping:
          - dps_val: false
            icon: "mdi:pause-box"
          - dps_val: true
            icon: "mdi:play-box"
  - entity: switch
    name: Bluetooth playback
    icon: "mdi:bluetooth-audio"
    category: config
    dps:
      - id: 206
        type: boolean
        optional: true
        name: switch
  - entity: event
    name: Notification
    dps:
      - id: 212
        type: utf16b64
        name: event
        optional: true
        mapping:
          - dps_val: null
            value: null
          - value: notify
      - id: 212
        type: utf16b64
        optional: true
        name: message
