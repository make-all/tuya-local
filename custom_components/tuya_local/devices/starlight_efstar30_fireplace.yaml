name: Electric fireplace
products:
  - id: 4ty7wjbgbhocymxo
    manufacturer: Starlight
    model: EF-STAR30 2000W 30 inch Electric Fireplace
    model_id: EF-STAR30
entities:
  - entity: climate
    translation_key: heater
    dps:
      - id: 2
        name: temperature
        type: integer
        range:
          min: 16
          max: 31
      - id: 3
        name: current_temperature
        type: integer
      - id: 5
        type: string
        name: hvac_mode
        mapping:
          - dps_val: H0
            value: "off"
          - dps_val: H1
            value: heat
            hidden: true
          - dps_val: H2
            value: heat
      - id: 5
        type: string
        name: preset_mode
        mapping:
          - dps_val: H0
            value: none
          - dps_val: H1
            value: low
          - dps_val: H2
            value: high
  - entity: light
    translation_key: flame
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 101
        name: effect
        type: string
        mapping:
          - dps_val: "1"
            value: "Orange + Blue"
          - dps_val: "2"
            value: Orange
          - dps_val: "3"
            value: Blue
      - id: 102
        name: brightness
        type: string
        mapping:
          - dps_val: F1
            value: 51
          - dps_val: F2
            value: 102
          - dps_val: F3
            value: 153
          - dps_val: F4
            value: 204
          - dps_val: F5
            value: 255
  - entity: select
    name: Flame speed
    icon: "mdi:speedometer"
    category: config
    dps:
      - id: 105
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: "1"
          - dps_val: "2"
            value: "2"
          - dps_val: "3"
            value: "3"
  - entity: switch
    name: Flame only
    icon: "mdi:fire"
    category: config
    dps:
      - id: 107
        type: boolean
        name: switch
  - entity: number
    translation_key: volume
    category: config
    dps:
      - id: 106
        type: string
        name: value
        unit: "%"
        range:
          min: 0
          max: 100
        mapping:
          - dps_val: "0"
            value: 0
          - dps_val: "1"
            value: 33
          - dps_val: "2"
            value: 66
          - dps_val: "3"
            value: 100
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: "0H"
            value: cancel
          - dps_val: "30"
            value: "30m"
          - dps_val: "1H"
            value: "1h"
          - dps_val: "2H"
            value: "2h"
          - dps_val: "3H"
            value: "3h"
          - dps_val: "4H"
            value: "4h"
          - dps_val: "5H"
            value: "5h"
