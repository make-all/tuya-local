name: Car fridge
products:
  - id: iyqhndov8rdzqrlq
    manufacturer: EA
    model: Dual zone car fridge
entities:
  - entity: switch
    dps:
      - id: 101
        type: boolean
        name: switch
  # The device has separate Celsius (112-115) and Fahrenheit (117-120) dps, and
  # only updates the set matching its display unit (dp 105).
  - entity: climate
    name: Zone A
    dps:
      - id: 105
        type: string
        name: temperature_unit
        mapping:
          - dps_val: C
            value: C
          - dps_val: F
            value: F
      - id: 110
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: true
            value: cool
          - dps_val: false
            value: "off"
      - id: 112
        type: integer
        name: current_temperature
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: F
                value_redirect: current_temperature_f
      - id: 114
        type: integer
        name: temperature
        range:
          min: -20
          max: 20
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: F
                value_redirect: temperature_f
                range:
                  min: -4
                  max: 68
      - id: 117
        type: integer
        name: current_temperature_f
        hidden: true
      - id: 119
        type: integer
        name: temperature_f
        hidden: true
        range:
          min: -4
          max: 68
  - entity: climate
    name: Zone B
    dps:
      - id: 105
        type: string
        name: temperature_unit
        mapping:
          - dps_val: C
            value: C
          - dps_val: F
            value: F
      - id: 111
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: true
            value: cool
          - dps_val: false
            value: "off"
      - id: 113
        type: integer
        name: current_temperature
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: F
                value_redirect: current_temperature_f
      - id: 115
        type: integer
        name: temperature
        range:
          min: -20
          max: 20
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: F
                value_redirect: temperature_f
                range:
                  min: -4
                  max: 68
      - id: 118
        type: integer
        name: current_temperature_f
        hidden: true
      - id: 120
        type: integer
        name: temperature_f
        hidden: true
        range:
          min: -4
          max: 68
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 102
        type: boolean
        name: lock
  - entity: select
    translation_key: mode
    icon: "mdi:snowflake"
    dps:
      - id: 103
        type: string
        name: option
        mapping:
          - dps_val: ECO
            value: Eco
          - dps_val: MAX
            value: Max
  - entity: select
    name: Battery protection
    icon: "mdi:car-battery"
    category: config
    dps:
      - id: 104
        type: string
        name: option
        mapping:
          - dps_val: L
            value: Low
          - dps_val: M
            value: Medium
          - dps_val: H
            value: High
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 105
        type: string
        name: option
        mapping:
          - dps_val: C
            value: celsius
          - dps_val: F
            value: fahrenheit
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      # only reported when a fault is raised or cleared
      - id: 106
        type: bitfield
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 106
        type: bitfield
        optional: true
        name: fault_code
  - entity: sensor
    class: voltage
    category: diagnostic
    dps:
      - id: 122
        type: integer
        name: sensor
        unit: V
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    class: battery
    dps:
      - id: 123
        type: integer
        name: sensor
        unit: "%"
        class: measurement
