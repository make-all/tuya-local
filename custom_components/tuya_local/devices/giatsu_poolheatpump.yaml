name: Pool heat pump
products:
  - id: mtxjem2ltoilucfj
    manufacturer: Giatsu
    model: GIA-BP07MDA
entities:
  - entity: climate
    translation_only_key: pool_heatpump
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: preset_mode
            conditions:
              - dps_val: heat
                value: heat
              - dps_val: cool
                value: cool
              - dps_val: auto
                value: heat_cool
              - dps_val: [h_powerful, h_silent]
                value: heat
                hidden: true
              - dps_val: [c_powerful, c_silent]
                value: cool
                hidden: true
              - dps_val: [a_powerful, a_silent]
                value: heat_cool
                hidden: true
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 7
          max: 40
        mapping:
          - constraint: preset_mode
            conditions:
              - dps_val: [heat, h_powerful, h_silent]
                range:
                  min: 15
                  max: 40
              - dps_val: [cool, c_powerful, c_silent]
                range:
                  min: 7
                  max: 28
      - id: 3
        name: current_temperature
        type: integer
        mapping:
          - scale: 10
      - id: 4
        name: preset_mode
        type: string
        mapping:
          - dps_val: heat
            value: smart_heat
          - dps_val: h_powerful
            value: quick_heat
          - dps_val: h_silent
            value: quiet_heat
          - dps_val: cool
            value: smart_cool
          - dps_val: c_powerful
            value: quick_cool
          - dps_val: c_silent
            value: quiet_cool
          - dps_val: auto
            value: smart
          - dps_val: a_powerful
            value: quick
          - dps_val: a_silent
            value: quiet
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 9
        type: bitfield
        name: fault_code
