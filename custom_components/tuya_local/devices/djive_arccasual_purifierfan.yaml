name: Purifier fan
products:
  - id: 0aygnuspbczsvszw
    manufacturer: Djive
    model: Flowmate ARC Casual
entities:
  - entity: fan
    translation_key: air_purifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: sleep
            value: sleep
          - dps_val: fresh
            value: fresh
          - dps_val: strong
            value: strong
          - dps_val: auto
            value: auto
          - dps_val: close
            value: "off"
            hidden: true  # not mentioned in manual
      - id: 3
        type: integer
        name: speed
        range:
          min: 1
          max: 9
      - id: 5
        type: boolean
        name: oscillate
  - entity: switch
    translation_key: sound
    dps:
      - id: 13
        type: boolean
        name: switch
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 22
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 23
        type: integer
        name: sensor
        unit: min
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 24
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 24
        type: bitfield
        name: fault_code
  - entity: sensor
    class: pm25
    dps:
      - id: 101
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: switch
    translation_key: uv_sterilization
    category: config
    dps:
      - id: 102
        type: boolean
        name: switch
  - entity: sensor
    translation_key: filter_life
    category: diagnostic
    dps:
      - id: 103
        type: integer
        name: sensor
        unit: "%"
  - entity: button
    translation_key: filter_reset
    category: config
    dps:
      - id: 104
        type: boolean
        optional: true
        name: button
