name: AC controller
products:
  - id: y6lcryonnh5klkmo
    manufacturer: Rhino King
    model: Smart Thermostat
entities:
  - entity: climate
    translation_key: combo_floor
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: cold
                value: cool
              - dps_val: hot
                value: heat
              - dps_val: wind
                value: fan_only
              - dps_val: floor_heat
                value: heat
              - dps_val: heat_floorheat
                value: heat
              - dps_val: cold_floorcold
                value: cool
      - id: 2
        type: string
        name: mode
        hidden: true
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: wind
            value: fan_only
          - dps_val: cold
            value: cool
          - dps_val: hot
            value: heat
          - dps_val: floor_heat
            value: floor_heat
          - dps_val: heat_floorheat
            value: air_floor_heat
          - dps_val: cold_floorcold
            value: air_floor_cool
      - id: 16
        type: integer
        name: temperature
        range:
          min: 150
          max: 400
        mapping:
          - scale: 10
            step: 5
      - id: 24
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
      - id: 28
        type: string
        name: fan_mode
        mapping:
          - dps_val: auto
            value: Turbo
          - dps_val: "1"
            value: AI dehumidification
          - dps_val: "2"
            value: Very low
          - dps_val: "3"
            value: Low
          - dps_val: "4"
            value: Standard
          - dps_val: "5"
            value: High
      - id: 34
        type: integer
        name: current_humidity
