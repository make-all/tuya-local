name: Water heater
products:
  - id: nkclmliibkaygjd9
    manufacturer: Rheem
    model: EHG
entities:
  - entity: water_heater
    dps:
      - id: 1
        type: boolean
        name: operation_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: ECO_SMART
                value: eco
              - dps_val: STD
                value: electric
              - dps_val: TIMER
                value: performance
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 30
          max: 75
      - id: 3
        type: integer
        name: current_temperature
      - id: 4
        type: string
        name: mode
        hidden: true
      - id: 101
        type: string
        name: away_mode
        mapping:
          - dps_val: "CLOSE"
            value: false
          - dps_val: "OPEN"
            value: true
  - entity: binary_sensor
    class: running
    dps:
      - id: 5
        type: string
        name: sensor
        mapping:
          - dps_val: "1"
            value: false
          - dps_val: "2"
            value: true
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 9
        type: bitfield
        name: fault_code
      - id: 104
        type: boolean
        name: unknown_104
  - entity: number
    name: Start time
    category: config
    class: duration
    icon: "mdi:clock-start"
    dps:
      - id: 102
        type: integer
        name: value
        unit: h
        range:
          min: 0
          max: 23
  - entity: number
    name: End time
    category: config
    class: duration
    icon: "mdi:clock-end"
    dps:
      - id: 103
        type: integer
        name: value
        unit: h
        range:
          min: 0
          max: 23
