name: Tap timer
products:
  - id: 5jotr6jtclzapmik
    manufacturer: Holman
    model: WX4
entities:
  - entity: switch
    hidden: true  # marked "not enabled" despite being defined
    dps:
      - id: 1
        type: boolean
        optional: true
        name: switch
  - entity: sensor
    class: battery
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: "%"
        class: measurement
      - id: 105
        type: string
        name: level
        mapping:
          - dps_val: "0"
            value: Empty
          - dps_val: "1"
            value: Low
          - dps_val: "2"
            value: Normal
          - dps_val: "3"
            value: Empty - charging
          - dps_val: "4"
            value: Low - charging
          - dps_val: "5"
            value: Normal - charging
          - dps_val: "6"
            value: Full
  - entity: binary_sensor
    class: battery_charging
    dps:
      - id: 105
        type: string
        name: sensor
        mapping:
          - dps_val: "3"
            value: true
          - dps_val: "4"
            value: true
          - dps_val: "5"
            value: true
          - value: false
  - entity: select
    name: Weather delay
    category: config
    translation_key: timer
    icon: "mdi:weather-cloudy-clock"
    hidden: true  # marked "not enabled" despite being defined
    dps:
      - id: 10
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: "cancel"
            value: cancel
          - dps_val: "24h"
            value: "1d"
          - dps_val: "48h"
            value: "2d"
          - dps_val: "72h"
            value: "3d"
  - entity: time
    translation_key: timer
    category: config
    hidden: true  # marked "not enabled" despite being defined
    dps:
      - id: 11
        type: integer
        optional: true
        name: second
        range:
          min: 0
          max: 86399
  - entity: sensor
    name: Zone 1 soil temperature
    class: temperature
    hidden: unavailable
    dps:
      - id: 101
        type: integer
        optional: true
        name: sensor
        unit: C
        class: measurement
      - id: 101
        type: integer
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    name: Zone 1 soil moisture
    class: moisture
    hidden: unavailable
    dps:
      - id: 102
        type: integer
        optional: true
        name: sensor
        unit: "%"
        class: measurement
      - id: 102
