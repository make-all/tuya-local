          - dps_val: "ON"
            value: Running
          - dps_val: "OFF"
            value: Stopped

  - entity: number
    name: Boiler temperature setting
    icon: "mdi:speedometer"
    category: config
    dps:
      - id: 143
        type: integer
        optional: true
        name: value
        unit: "%"
        range:
          min: -15
