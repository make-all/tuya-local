          max: 12

  - entity: number
    name: Normally open bypass delay
    icon: "mdi:clock-start"
    class: duration
    category: config
    dps:
      - id: 110
        type: integer
        optional: true
        name: value
        unit: "s"
        mapping:
          - step: 5
        range:
          min: 0
          max: 250

  - entity: number
    name: Normally closed bypass delay
    icon: "mdi:clock-end"
    class: duration
    category: config
    dps:
      - id: 112
        type: integer
