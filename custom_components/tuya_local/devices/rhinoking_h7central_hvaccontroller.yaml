    dps:
      - id: 134
        type: integer
        optional: true
        name: value
        range:
          min: 0
          max: 10

  - entity: number
    name: Outdoor unit heating water temperature
    class: temperature
    category: config
    dps:
      - id: 119
        type: integer
        optional: true
        name: value
        unit: "°C"
        range:
          min: 25
          max: 55

  - entity: number
    name: Tank temperature differential
    class: temperature_delta
    category: config
    dps:
      - id: 120
        type: integer
        optional: true
        name: value
        unit: "°C"
        range:
          min: 1
          max: 5

  - entity: number
    name: Minimum floor heating supply temperature
    class: temperature
    category: config
    dps:
      - id: 124
        type: integer
        optional: true
        name: value
        unit: "°C"
        range:
          min: 25
          max: 45

  - entity: number
    name: Outdoor unit cooling target temperature
    class: temperature
    category: config
    dps:
      - id: 129
        type: integer
        optional: true
        name: value
        unit: "°C"
        range:
          min: 5
          max: 20

  - entity: number
    name: Cooling valve changeover start month
    icon: "mdi:calendar-month"
    category: config
    dps:
      - id: 140
        type: integer
        optional: true
        name: value
        range:
          min: 1
          max: 4

  - entity: number
    name: Heating valve changeover start month
    icon: "mdi:calendar-month"
    category: config
    dps:
      - id: 141
        type: integer
        optional: true
        name: value
        range:
