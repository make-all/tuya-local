        name: value
        unit: "s"
        mapping:
          - step: 5
        range:
          min: 0
          max: 250

  - entity: number
    name: Mixing pump start delay
    icon: "mdi:clock-start"
    class: duration
    category: config
    dps:
      - id: 110
        type: integer
        optional: true
        name: value
        unit: "s"
        mapping:
          - step: 5
        range:
          min: 0
          max: 250

  - entity: number
    name: Mixing pump stop delay
    icon: "mdi:clock-end"
    class: duration
    category: config
    dps:
      - id: 113
        type: integer
        optional: true
        name: value
        unit: "s"
        mapping:
          - step: 5
        range:
          min: 0
          max: 250

  - entity: switch
    name: Radiant mixing control
    icon: "mdi:water-sync"
    category: config
    dps:
      - id: 114
        type: boolean
        optional: true
        name: switch

  - entity: select
    name: Outdoor unit operating state
    category: config
    icon: "mdi:power-cycle"
    dps:
      - id: 106
        type: string
        optional: true
        name: option
