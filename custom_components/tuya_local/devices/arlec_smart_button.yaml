name: Smart button
products:
  - id: kpzc6pm8
    manufacturer: Arlec
    model: SG022HA
  - id: ja5osu5g
    model: ZG101Z
entities:
  - entity: event
    class: button
    dps:
      - id: 1
        type: string
        name: event
        optional: true
        mapping:
          - dps_val: single_click
            value: press_end
          - dps_val: long_press
            value: long_press_end
          - dps_val: double_click
            value: multi_press_end
      - id: 1
        type: string
        optional: true
        name: multi_press_count
        mapping:
          - dps_val: double_click
            value: 2
          - value: null
  - entity: sensor
    class: battery
    dps:
      - id: 10
        type: integer
        name: sensor
        unit: "%"
