name: Vertical blinds
products:
  - id: f4jrc6yn2pfqhnco
    manufacturer: Nova
    model: Q1-3E-1.2
entities:
  - entity: cover
    class: blind
    dps:
      - id: 1
        name: control
        type: string
        optional: true
        mapping:
          - dps_val: open
            value: open
          - dps_val: close
            value: close
          - dps_val: stop
            value: stop
      - id: 2
        name: tilt_position
        type: integer
        optional: true
        range:
          min: 0
          max: 100
        mapping:
          - value_mirror: tilt_current_pos
      - id: 3
        name: tilt_current_pos
        type: integer
        hidden: true
      - id: 7
        name: work_state
        type: string
        optional: true
  - entity: switch
    name: Reverse
    category: config
    icon: "mdi:arrow-u-down-left"
    dps:
      - id: 5
        type: string
        name: switch
        mapping:
          - dps_val: back
            value: true
          - dps_val: forward
            value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 12
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 12
        name: fault_code
        type: bitfield
  - entity: number
    name: Travel time
    class: duration
    category: config
    dps:
      - id: 10
        type: integer
        optional: true
        name: value
        unit: s
        range:
          min: 0
          max: 120000
        mapping:
          - scale: 1000
