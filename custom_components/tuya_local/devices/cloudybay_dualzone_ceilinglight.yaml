name: Ceiling light
products:
  - id: maxit67l9kzvshnl
    manufacturer: Cloudy Bay
    model: LFMC815SMWH
entities:
  - entity: switch
    dps:
      - id: 20
        type: boolean
        name: switch
  - entity: light
    dps:
      - id: 20
        type: boolean
        name: std_switch
        mapping:
          - dps_val: true
            constraint: work_mode
            conditions:
              - dps_val: colour
                value: false
      - id: 21
        name: work_mode
        type: string
      - id: 22
        name: std_brightness
        type: integer
        range:
          min: 10
          max: 1000
      - id: 23
        name: std_color_temp
        type: integer
        range:
          min: 0
          max: 1000
        mapping:
          - target_range:
              min: 2700
              max: 6500
      - id: 51
        type: base64
        optional: true
        mask: "000100000000000000000000"
        name: switch
        mapping:
          - dps_val: null
            value_mirror: std_switch
      - id: 51
        type: base64
        optional: true
        mask: "0000000000000000FFFF0000"
        name: brightness
        mapping:
          - dps_val: null
            value_mirror: std_brightness
        range:
          min: 10
          max: 1000
      - id: 51
        type: base64
        optional: true
        mask: "00000000000000000000FFFF"
        name: color_temp
        mapping:
          - dps_val: null
            value_mirror: std_color_temp
          - target_range:
              min: 2700
              max: 6500
        range:
          min: 0
          max: 1000
  - entity: light
    translation_key: color_light
    dps:
      - id: 20
        type: boolean
        name: std_switch
        mapping:
          - dps_val: true
            constraint: work_mode
            conditions:
              - dps_val: white
                value: false
      - id: 21
        name: work_mode
        type: string
      - id: 24
        name: std_rgbhsv
        type: hex
        format:
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 0
              max: 1000
      - id: 51
        type: base64
        optional: true
        mask: "000200000000000000000000"
        name: switch
        mapping:
          - dps_val: null
            value_mirror: std_switch
      - id: 51
        type: base64
        optional: true
        name: rgbhsv
        format:
          - name: sw
            bytes: 2
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 10
              max: 1000
          - name: wb
            bytes: 2
          - name: wc
            bytes: 2
        mapping:
          - dps_val: null
            value_mirror: std_rgbhsv
  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 26
        type: integer
        name: second
        range:
          min: 0
          max: 86399
  - entity: text
    name: Music
    category: config
    icon: "mdi:music"
    hidden: true
    dps:
      - id: 27
        type: string
        optional: true
        name: value
  - entity: text
