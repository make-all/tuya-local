name: Drying rack
products:
  - id: z8cdwcirki1ethwc
    manufacturer: Steigen
    model: Solar Ultra
entities:
  - entity: cover
    icon: "mdi:hanger"
    dps:
      - id: 2
        type: string
        optional: true
        name: control
        mapping:
          - dps_val: up
            value: close
          - dps_val: down
            value: open
          - dps_val: stop
            value: stop
      - id: 9
        type: string
        name: action
        mapping:
          - dps_val: up
            value: closing
          - dps_val: down
            value: opening
          - value: null
      - id: 101
        type: string
        optional: true
        name: current_position
        mapping:
          - dps_val: top
            value: 0
          - dps_val: centre
            value: 50
          - dps_val: bottom
            value: 100
  - entity: light
    dps:
      - id: 4
        type: boolean
        name: switch
  - entity: switch
    translation_key: ionizer
    category: config
    dps:
      - id: 5
        type: boolean
        name: switch
  - entity: switch
    name: Fan
    icon: "mdi:weather-windy"
    dps:
      - id: 6
        type: boolean
        name: switch
  - entity: switch
    name: Heat
    icon: "mdi:heat-wave"
    dps:
      - id: 7
        type: boolean
        name: switch
  - entity: select
    name: Ionizer timer
    translation_key: timer
    category: config
    dps:
      - id: 10
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: 10min
            value: 10m
          - dps_val: 20min
            value: 20m
          - dps_val: 30min
            value: 30m
  - entity: select
    name: Heat timer
    translation_key: timer
    category: config
    dps:
      - id: 11
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
  - entity: select
    name: Wind timer
    translation_key: timer
    category: config
    dps:
      - id: 13
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
  - entity: sensor
    name: Heat remaining
    class: duration
    category: diagnostic
    dps:
      - id: 15
        type: integer
        optional: true
        name: sensor
        unit: min
  - entity: sensor
    name: Wind remaining
    class: duration
    category: diagnostic
    dps:
      - id: 16
        type: integer
        optional: true
        name: sensor
        unit: min
  - entity: sensor
    name: Ionizer remaining
    class: duration
    category: diagnostic
    dps:
      - id: 17
        type: integer
        optional: true
        name: sensor
        unit: min
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 18
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 18
        type: bitfield
        name: fault_code
