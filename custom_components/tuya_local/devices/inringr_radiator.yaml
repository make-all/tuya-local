name: Radiator
products:
  - id: nqca56qbzkjyakwu
    model: IN-RING-R
entities:
  - entity: climate
    translation_key: heater
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: thaw
            value: anti_frost
          - dps_val: eco
            value: eco
          - dps_val: comf
            value: comfort
          - dps_val: boost
            value: boost
          - dps_val: pragram
            value: program
          - dps_val: travel
            value: away
      - id: 16
        type: integer
        name: temperature
        unit: C
        range:
          min: 7
          max: 30
      - id: 24
        type: integer
        name: current_temperature
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 27
        type: integer
        name: value
        unit: C
        range:
          min: -5
          max: 5
  - entity: text
    translation_key: schedule
    category: config
    hidden: true
    dps:
      - id: 53
        type: base64
        optional: true
        name: value
  - entity: number
    name: Away days
    category: config
    class: duration
    icon: "mdi:island"
    dps:
      - id: 101
        type: integer
        optional: true
        name: value
        unit: d
        range:
          min: 1
          max: 60
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 102
        type: boolean
        name: lock
  - entity: select
    name: Open window detection
    translation_key: timer
    icon: "mdi:window-open-variant"
    category: config
    dps:
      - id: 112
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: cancel
          - dps_val: "60"
            value: "1h"
          - dps_val: "90"
            value: "1h30m"
