name: Floor lamp
products:
  - id: oyvz9kqyvcl7b45n
    manufacturer: LSC Smart Connect
    model: RGB Floor lamp
entities:
  - entity: light
    dps:
      - id: 20
        type: boolean
        name: switch
      - id: 21
        name: effect
        type: string
        mapping:
          - dps_val: white
            value: "off"
            hidden: true
          - dps_val: colour
            value: "off"
          - dps_val: scene
            value: Scene
          - dps_val: music
            value: Music
      - id: 24
        name: rgbhsv
        type: hex
        format:
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 0
              max: 1000
  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 26
        type: integer
        name: second
        range:
          min: 0
          max: 86399
  - entity: text
    translation_key: scene
    category: config
    hidden: true
    dps:
      - id: 51
        type: base64
        optional: true
        name: value
  - entity: text
    name: Music
    category: config
    icon: "mdi:music"
    hidden: true
    dps:
      - id: 52
        type: base64
        optional: true
        name: value
  - entity: text
    name: Paint
    category: config
    icon: "mdi:palette"
    hidden: true
    dps:
      - id: 61
        type: base64
        optional: true
        name: value
  - entity: switch
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: light
    name: Base
    dps:
      - id: 102
        type: boolean
        name: switch
      - id: 103
        name: brightness
        type: integer
        range:
          min: 10
          max: 1000
      - id: 105
        name: rgbhsv
        type: hex
        format:
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 0
              max: 1000
      - id: 106
        type: string
        name: color_mode
        mapping:
          - dps_val: white
            value: white
          - dps_val: colour
            value: hs
          - dps_val: scene
            value: Scene
  - entity: text
    name: Base scene
    category: config
    icon: "mdi:palette"
    hidden: true
    dps:
      - id: 107
        type: string
        optional: true
        name: value
