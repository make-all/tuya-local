name: RGBW garden light controller
products:
  - id: hfeoflonjnm0kqir
    manufacturer: Brilliant
    model: 60W RGBW Combi Controller
    model_id: 22629/06
entities:
  - entity: light
    dps:
      - id: 20
        type: boolean
        name: switch
      - id: 21
        type: string
        name: color_mode
        mapping:
          - dps_val: white
            value: white
          - dps_val: colour
            value: hs
          - dps_val: scene
            value: Scene
          - dps_val: music
            value: Music
            # Smart Life drives music mode from the phone microphone; setting
            # the mode locally has no visible effect.
            hidden: true
      - id: 22
        type: integer
        name: brightness
        range:
          min: 10
          max: 1000
      - id: 24
        type: hex
        name: rgbhsv
        format:
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 0
              max: 1000
  - entity: light
    name: White
    dps:
      - id: 20
        type: boolean
        name: main_power
        hidden: true
      # DP51 retains channel selections when master power is off.
      # Request it explicitly because normal status polls omit it.
      - id: 51
        type: base64
        name: switch
        optional: true
        force: true
        mask: "000100000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 1
            value: true
            constraint: main_power
            conditions:
              - dps_val: false
                value: false
              - dps_val: true
                value: true
      - id: 51
        type: base64
        name: brightness
        optional: true
        mask: "0000000000000000FFFF0000"
        range:
          min: 10
          max: 1000
      - id: 51
        type: base64
        name: available
        optional: true
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: light
    translation_key: color_light
    dps:
      - id: 20
        type: boolean
        name: main_power
        hidden: true
      - id: 51
        type: base64
        name: switch
        optional: true
        mask: "000200000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 1
            value: true
            constraint: main_power
            conditions:
              - dps_val: false
                value: false
              - dps_val: true
                value: true
      # Preserve the channel flags and white settings when changing colour.
      - id: 51
        type: base64
        name: rgbhsv
        optional: true
        format:
          - name: switches
            bytes: 2
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 10
              max: 1000
          - name: white_brightness
            bytes: 2
          - name: color_temperature
            bytes: 2
      - id: 51
        type: base64
        name: available
        optional: true
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: number
    translation_key: timer
    class: duration
    category: config
    dps:
      - id: 26
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 86400
  - entity: select
    translation_key: initial_state
    category: config
    dps:
      - id: 34
        type: boolean
        name: option
        mapping:
          - dps_val: true
            value: "off"
          - dps_val: false
            value: "on"
  - entity: select
    translation_key: scene
    dps:
      # DP36 is raw in the cloud model, but the device API exposes the
      # payload as a base64 string. Selecting a payload makes the controller
      # switch DP21 to scene mode automatically.
      - id: 36
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: "AAABAQENDgAAyAAA"
            value: night
          - dps_val: "AAEBAQENDgAD6AAA"
            value: reading
          - dps_val: "AAIBAQENDgAD6AAA"
            value: working
          - dps_val: "AAMBAQENDgAB9AAA"
            value: leisure
          - dps_val: "AAQAAAECA0ZGAgB4A+gD6EZGAgB4A+gACg=="
            value: prairie
          - dps_val: "AAUAAAEGA0ZGAQAAA+gD6EZGAQB4A+gD6EZGAQDwA+gD6EZGAQA9A+gD6\
              EZGAQCuA+gD6EZGAQETA+gACg=="
            value: fun
          - dps_val: "AAYAAAEDA0ZGAQAAA+gD6EZGAQB4A+gD6EZGAQDwA+gD6A=="
            value: dazzle
          - dps_val: "AAcAAAEDA0ZGAgAAA+gD6EZGAgB4A+gD6EZGAgDwA+gD6EZGAgA9A+gD6\
              EZGAgCuA+gD6EZGAgETA+gACg=="
            value: colorful
          - dps_val: "ABQAAAEDA0ZGAgCuA+gD6EZGAgC0ASwD6EZGAgC0ADID6A=="
            value: blue_sky
          - dps_val: "AB0AAAEDA0ZGAQAAA+gD6EZGAQDwA+gD6EZGAgB4A+gD6EZGAgA9A+gD6\
              A=="
            value: mediterranean
          - dps_val: "ACAAAAEGA2RkAQA9A+gD6GRkAQB4A+gD6FpaAQETA+gD6FpaAQCuA+gD6\
              GRkAQAyAfQD6GRkAQAAA+gD6A=="
            value: birthday
          - dps_val: "ACIAAAEGA1paAQDwA+gD6FpaAQA9A+gD6EZGAQAAA+gD6FpaAQCuA+gD6\
              FpaAQETA+gD6EZGAQB4A+gD6A=="
            value: christmas
          - dps_val: "ADIBAQEODQAAyAEGA0ZGAgAAA+gD6EZGAgB4A+gD6EZGAgDwA+gD6EZGA\
              gA9A+gD6EZGAgCuA+gD6EZGAgETA+gD6A=="
            value: streamer
          - dps_val: "ADMBAQEODQAB9AEGA0ZGAQAAA+gD6EZGAQB4A+gD6EZGAQDwA+gD6EZGA\
              QA9A+gD6EZGAQCuA+gD6EZGAQETA+gD6A=="
            value: entertainment
