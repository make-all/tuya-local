name: RGBW garden light controller
products:
  - id: hfeoflonjnm0kqir
    manufacturer: Brilliant
    model: 60W RGBW Combi Controller
    model_id: 22629/06
entities:
  - entity: light
    dps:
      - id: 20
        type: boolean
        name: switch
      - id: 21
        type: string
        name: color_mode
        mapping:
          - dps_val: white
            value: white
          - dps_val: colour
            value: hs
          - dps_val: scene
            value: Scene
          - dps_val: music
            value: Music
      - id: 22
        type: integer
        name: brightness
        range:
          min: 10
          max: 1000
      - id: 24
        type: hex
        name: rgbhsv
        format:
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 0
              max: 1000
      # The cloud model uses raw scene data on DP36, not hex scenes on DP25.
      # Keep its payload as an attribute until the format is known.
      - id: 36
        type: base64
        name: scene_data
        optional: true
  - entity: light
    name: White
    dps:
      - id: 20
        type: boolean
        name: main_power
        hidden: true
      # DP51 retains channel selections when master power is off.
      # Request it explicitly because normal status polls omit it.
      - id: 51
        type: base64
        name: switch
        optional: true
        force: true
        mask: "000100000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 1
            value: true
            constraint: main_power
            conditions:
              - dps_val: false
                value: false
              - dps_val: true
                value: true
      - id: 51
        type: base64
        name: brightness
        optional: true
        mask: "0000000000000000FFFF0000"
        range:
          min: 10
          max: 1000
      - id: 51
        type: base64
        name: available
        optional: true
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: light
    translation_key: color_light
    dps:
      - id: 20
        type: boolean
        name: main_power
        hidden: true
      - id: 51
        type: base64
        name: switch
        optional: true
        mask: "000200000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 1
            value: true
            constraint: main_power
            conditions:
              - dps_val: false
                value: false
              - dps_val: true
                value: true
      # Preserve the channel flags and white settings when changing colour.
      - id: 51
        type: base64
        name: rgbhsv
        optional: true
        format:
          - name: switches
            bytes: 2
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 2
            range:
              min: 0
              max: 1000
          - name: v
            bytes: 2
            range:
              min: 10
              max: 1000
          - name: white_brightness
            bytes: 2
          - name: color_temperature
            bytes: 2
      - id: 51
        type: base64
        name: available
        optional: true
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: number
    translation_key: timer
    class: duration
    category: config
    dps:
      - id: 26
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 86400
  - entity: switch
    translation_key: do_not_disturb
    category: config
    dps:
      - id: 34
        type: boolean
        name: switch
