name: Heater
products:
  - id: 6b5i5bg5aesvfnea
    manufacturer: Castle Heaters
    model: NR10/15/20
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: "heat"
          - dps_val: false
            value: "off"
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 5
          max: 50
        mapping:
          - constraint: preset_mode
            conditions:
              - dps_val: af
                value: 5
                range:
                  min: 5
                  max: 5
      - id: 3
        name: current_temperature
        type: integer
      - id: 4
        name: preset_mode
        type: string
        mapping:
          - dps_val: low
            value: eco
          - dps_val: high
            value: boost
          - dps_val: af
            value: away
  - entity: binary_sensor
    class: problem
    category: diagnostic
    hidden: true  # Apparently never reported
    dps:
      - id: 12
        type: bitfield
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 12
        type: bitfield
        optional: true
        name: fault_code
