name: Fireplace
# manufacturer/model unknown - sold under multiple brands as
# "PRO V2 W/Wi-Fi & Bluetooth LE"
products:
  - id: v4r5dzjgkhnagnqc
    manufacturer: Modern Flames
    model: Landscape Pro Slim
entities:
  - entity: climate
    icon: "mdi:fireplace"
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: fan_only
            constraint: fan_mode
            conditions:
              - dps_val: "1"
                value: fan_only
              - dps_val: "2"
                value: heat
              - dps_val: "3"
                value: heat
                hidden: true
      - id: 2
        name: temperature
        type: integer
        range:
          min: 10
          max: 30
        optional: true
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_set_f
                range:
                  min: 50
                  max: 85
      - id: 3
        name: current_temperature
        type: integer
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_current_f
      - id: 5
        name: fan_mode
        type: string
        mapping:
          - dps_val: "1"
            value: "off"
          - dps_val: "2"
            value: low
          - dps_val: "3"
            value: high
      - id: 19
        name: temperature_unit
        type: string
        mapping:
          - value: C
          - dps_val: f
            value: F
      - id: 20
        name: temp_set_f
        type: integer
        hidden: true
        optional: true
        range:
          min: 50
          max: 85
      - id: 21
        name: temp_current_f
        type: integer
        hidden: true
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 11
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: cancel
          - dps_val: "0_5"
            value: "30m"
          - dps_val: "1"
            value: "1h"
          - dps_val: "2"
            value: "2h"
          - dps_val: "3"
            value: "3h"
          - dps_val: "4"
            value: "4h"
          - dps_val: "5"
            value: "5h"
          - dps_val: "6"
            value: "6h"
          - dps_val: "7"
            value: "7h"
          - dps_val: "8"
            value: "8h"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 12
        type: integer
        name: sensor
        unit: min
  - entity: select
    translation_key: scene
    icon: "mdi:palette"
    category: config
    dps:
      - id: 4
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: Default
          - dps_val: "1"
            value: Rainbow fade
          - dps_val: "2"
            value: 3-color fade
          - dps_val: "3"
            value: Red fade
          - dps_val: "4"
            value: Green fade
          - dps_val: "5"
            value: Blue fade
          - dps_val: "6"
            value: Rainbow jump
          - dps_val: "7"
            value: 3-color jump
          - dps_val: "8"
            value: Custom 1
          - dps_val: "9"
            value: Custom 2
          - dps_val: "10"
            value: Custom 3
  - entity: light
    translation_key: flame
    category: config
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 101
        name: rgbhsv
        type: hex
        format:
          - name: r
            bytes: 1
          - name: g
            bytes: 1
          - name: b
            bytes: 1
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 1
            range:
              min: 0
              max: 100
          - name: v
            bytes: 1
            range:
              min: 0
              max: 100
  - entity: light
    translation_key: embers
    category: config
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 102
        name: rgbhsv
        type: hex
        format:
          - name: r
            bytes: 1
          - name: g
            bytes: 1
          - name: b
            bytes: 1
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 1
            range:
              min: 0
              max: 100
          - name: v
            bytes: 1
            range:
              min: 0
              max: 100
  - entity: light
    name: Downlight
    icon: "mdi:spotlight-beam"
    category: config
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 103
        name: rgbhsv
        type: hex
        format:
          - name: r
            bytes: 1
          - name: g
            bytes: 1
          - name: b
            bytes: 1
          - name: h
            bytes: 2
            range:
              min: 0
              max: 360
          - name: s
            bytes: 1
            range:
              min: 0
              max: 100
          - name: v
            bytes: 1
            range:
              min: 0
              max: 100
  - entity: switch
    name: Sync lights
    icon: "mdi:sync"
    category: config
    dps:
      - id: 104
        type: boolean
        name: switch
  - entity: select
    name: Flame motor speed
    icon: "mdi:fan"
    category: config
    dps:
      - id: 110
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: "1"
          - dps_val: "2"
            value: "2"
          - dps_val: "3"
            value: "3"
          - dps_val: "4"
            value: "4"
  - entity: text
    name: Custom scene 1
    icon: "mdi:playlist-edit"
    category: config
    hidden: true
    dps:
      - id: 105
        type: string
        name: value
        optional: true
  - entity: text
    name: Custom scene 2
    icon: "mdi:playlist-edit"
    category: config
    hidden: true
    dps:
      - id: 106
        type: string
        name: value
        optional: true
  - entity: text
    name: Custom scene 3
    icon: "mdi:playlist-edit"
    category: config
    hidden: true
    dps:
      - id: 107
        type: string
        name: value
        optional: true
  - entity: text
    name: Custom scene preview
    icon: "mdi:eye"
    category: diagnostic
    hidden: true
    dps:
      - id: 108
        type: string
        name: value
        optional: true
  - entity: text
    translation_key: schedule
    icon: "mdi:calendar-clock"
    category: config
    hidden: true
    dps:
      - id: 109
        type: base64
        name: value
        optional: true
