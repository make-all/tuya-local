name: Towel rail
products:
  - id: ji3x9qix6suekhrj
    manufacturer: Manissa
    model: OWS-02A
entities:
  - entity: climate
    translation_key: heater
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: hot
            value: comfort
          - dps_val: eco
            value: eco
          - dps_val: cold
            value: boost
          - dps_val: auto
            value: program
      - id: 16
        type: integer
        name: temperature
        unit: C
        range:
          min: 300
          max: 700
        mapping:
          - scale: 10
            step: 10
      - id: 24
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 27
        type: integer
        name: value
        unit: C
        range:
          min: -5
          max: 5
  - entity: select
    translation_key: timer
    name: Boost time
    category: config
    dps:
      - id: 41
        type: string
        name: option
        mapping:
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 56
        type: integer
        optional: true
        name: second
        range:
          min: 0
          max: 86399
  - entity: text
    translation_key: schedule
    category: config
    hidden: true
    dps:
      - id: 110
        type: base64
        optional: true
        name: value
  - entity: switch
    name: Open window detection
    category: config
    dps:
      - id: 111
        type: boolean
        name: switch
