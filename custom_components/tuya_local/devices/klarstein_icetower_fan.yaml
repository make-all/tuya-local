name: Tower fan
products:
  - id: fskm5vfjggvuufmx
    manufacturer: Klarstein
    model: Icetower Smart
entities:
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 2
        type: string
        name: speed
        mapping:
          - dps_val: low
            value: 33
          - dps_val: mid
            value: 67
          - dps_val: high
            value: 100
      - id: 3
        type: string
        name: preset_mode
        mapping:
          - dps_val: sleep
            value: sleep
          - dps_val: ordinary
            value: normal
          - dps_val: nature
            value: nature
      - id: 10
        type: boolean
        name: oscillate
  - entity: switch
    name: Cool
    category: config
    hidden: unavailable
    dps:
      - id: 6
        type: boolean
        optional: true
        name: switch
      - id: 6
        type: boolean
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    class: temperature
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 11
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
          - dps_val: "9h"
            value: "9h"
          - dps_val: "10h"
            value: "10h"
          - dps_val: "11h"
            value: "11h"
          - dps_val: "12h"
            value: "12h"
