name: Pet sofa
products:
  - id: 13oghytketwcoz1z
    manufacturer: Tesla
    model: Smart Pet Sofa PS300

entities:
  - entity: climate
    icon: "mdi:sofa"
    name: Pet sofa
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: "heat_cool"
          - dps_val: false
            value: "off"
      - id: 8
        name: temperature
        type: integer
        unit: C
        range:
          min: 20
          max: 38
      - id: 16
        name: current_temperature
        type: integer

      - id: 101
        name: hvac_action
        type: integer
        mapping:
          - dps_val: 1
            value: idle
          - dps_val: 2
            value: heating
          - dps_val: 3
            value: cooling
      - id: 7
        name: preset_mode
        type: string
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: manual
            value: manual
          - dps_val: smart
            value: smart

  - entity: sensor
    translation_key: ambient_temperature
    class: temperature
    dps:
      - id: 102
        type: integer
        name: sensor
        unit: "C"

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 22
        type: bitfield
        name: fault_code
      - id: 105
        type: integer
        name: push_state
