name: Humidifier
products:
  - id: w7c75twee9njzqw6
    manufacturer: Tuvio
    model: TUH05DE
entities:
  - entity: humidifier
    class: humidifier
    dps:
      - id: 1
        name: switch
        type: boolean
      - id: 13
        name: humidity
        type: integer
        range:
          min: 0
          max: 80
      - id: 14
        name: current_humidity
        type: integer
      - id: 23
        name: mode
        type: string
        mapping:
          - dps_val: level_1
            value: low
          - dps_val: level_2
            value: medium
          - dps_val: level_3
            value: high
          - dps_val: level4
            value: auto
  - entity: switch
    category: config
    name: Mist
    dps:
      - id: 2
        name: switch
        type: boolean
  - entity: light
    translation_key: display
    category: config
    dps:
      - id: 5
        name: switch
        type: boolean
  - entity: switch
    category: config
    translation_key: sleep
    dps:
      - id: 16
        name: switch
        type: boolean
  - entity: switch
    category: config
    translation_key: uv_sterilization
    dps:
      - id: 21
        name: switch
        type: boolean
  - entity: switch
    category: config
    translation_key: ionizer
    dps:
      - id: 25
        name: switch
        type: boolean
  - entity: sensor
    class: temperature
    dps:
      - id: 10
        name: sensor
        type: integer
        unit: °C
  - entity: sensor
    class: humidity
    dps:
      - id: 14
        name: sensor
        type: integer
        unit: '%'
  - entity: sensor
    category: diagnostic
    name: Indicator color
    dps:
      - id: 6
        name: sensor
        type: string
  - entity: binary_sensor
    category: diagnostic
    class: problem
    dps:
      - id: 22
        name: sensor
        type: bitfield
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 22
        name: fault_code
        type: bitfield
