entities:
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "1"
    dps:
      - id: 1
        type: boolean
        name: switch
  - entity: switch
    translation_key: switch_x
    translation_placeholders:
      x: "2"
    dps:
      - id: 2
        type: boolean
        name: switch
  - entity: time
    translation_key: timer_x
    translation_placeholders:
      x: "1"
    category: config
    dps:
      - id: 7
        type: integer
        name: second
        range:
          min: 0
          max: 86400
  - entity: time
    translation_key: timer_x
    translation_placeholders:
      x: "2"
    category: config
    dps:
      - id: 8
        type: integer
        name: second
        range:
          min: 0
          max: 86400
  - entity: select
    translation_key: initial_state
    category: config
    hidden: unavailable
    dps:
      - id: 14
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: "off"
            value: "off"
          - dps_val: "on"
            value: "on"
          - dps_val: memory
            value: memory
      - id: 14
        type: string
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
