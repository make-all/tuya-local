name: Tesla Smart Pet Sofa PS300

products:
  - id: 13oghytketwcoz1z
    manufacturer: Tesla
    model: Smart Pet Sofa PS300

entities:
  - entity: climate
    icon: mdi:sofa
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: "heat_cool"
          - dps_val: false
            value: "off"

      - id: 8
        name: temperature
        type: integer
        unit: C
        range:
          min: 0
          max: 45
        step: 1

      - id: 16
        name: current_temperature
        type: integer

      - id: 101
        name: hvac_action
        type: integer
        mapping:
          - dps_val: 1
            value: idle
          - dps_val: 2
            value: heating
          - dps_val: 3
            value: cooling

      - id: 7
        name: preset_mode
        type: string
        mapping:
          - dps_val: auto
            value: Auto
          - dps_val: manual
            value: Manual
          - dps_val: smart
            value: Smart

  - entity: sensor
    name: Ambient temperature
    class: temperature
    dps:
      - id: 102
        type: integer
        name: sensor
        unit: C

  - entity: sensor
    name: Fault
    category: diagnostic
    dps:
      - id: 22
        type: integer
        name: sensor

  - entity: text
    name: LED schedule
    category: config
    dps:
      - id: 103
        type: string
        name: text

  - entity: text
    name: Schedule
    category: config
    dps:
      - id: 104
        type: string
        name: text

  - entity: sensor
    name: Push state
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
