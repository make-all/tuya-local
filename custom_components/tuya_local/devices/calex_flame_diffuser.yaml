name: Calex Flame Diffuser
products:
  - id: jwusuabpzoyjpaxu
    manufacturer: Calex
    model: Flame Diffuser
entities:
  - entity: fan
    translation_key: aroma_diffuser
    dps:
      - id: 1
        name: switch
        type: boolean
      - id: 3
        name: speed
        type: string
        mapping:
          - dps_val: large
            value: 100
          - dps_val: middle
            value: 66
          - dps_val: small
            value: 33
  - entity: switch
    name: Power
    class: switch
    category: config
    dps:
      - id: 1
        type: boolean
        name: switch
  - entity: switch
    name: Spray
    class: switch
    category: config
    dps:
      - id: 2
        name: switch
        type: boolean
  - entity: light
    translation_key: flame
    dps:
      - id: 7
        name: switch
        type: boolean
      - id: 8
        name: brightness
        type: integer
        optional: true
        range:
          min: 0
          max: 1000
  - entity: light
    name: Button backlight
    dps:
      - id: 102
        name: switch
        type: boolean
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 4
        name: option
        type: string
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: 1h
            value: "1"
          - dps_val: 2h
            value: "2"
          - dps_val: 3h
            value: "3"
          - dps_val: 4h
            value: "4"
          - dps_val: 5h
            value: "5"
          - dps_val: 6h
            value: "6"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 5
        type: integer
        name: sensor
        unit: min
  - entity: switch
    name: "72 h filter reminder"
    category: config
    dps:
      - id: 101
        name: switch
        type: boolean
  - entity: binary_sensor
    translation_key: problem
    category: diagnostic
    dps:
      - id: 11
        name: sensor
        type: bitfield
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 11
        name: fault_code
        type: bitfield
