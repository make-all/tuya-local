name: Dual buttons
products:
  - id: l8yaz4um5b3pwyvf
    manufacturer: Linkoze
    model: LKWSW201
entities:
  - entity: event
    name: Button 1
    class: button
    dps:
      - id: 1
        type: string
        name: event
        mapping:
          - dps_val: single_click
            value: press_end
          - dps_val: long_press
            value: long_press_end
          - dps_val: double_click
            value: multi_press_end
      - id: 1
        type: string
        name: multi_press_count
        mapping:
          - dps_val: double_click
            value: 2
          - value: null
  - entity: event
    name: Button 2
    class: button
    dps:
      - id: 2
        type: string
        name: event
        mapping:
          - dps_val: single_click
            value: press_end
          - dps_val: long_press
            value: long_press_end
          - dps_val: double_click
            value: multi_press_end
      - id: 2
        type: string
        name: multi_press_count
        mapping:
          - dps_val: double_click
            value: 2
          - value: null
  - entity: sensor
    class: battery
    dps:
      - id: 10
        type: integer
        name: sensor
        unit: "%"
        optional: true
