name: Pool monitor
# products:
#   - id: UNKNOWN
#     manufacturer: Rovynel
#     model: 8-in-1
entities:
  - entity: sensor
    name: TDS
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: ppm
        class: measurement
  - entity: sensor
    class: temperature
    dps:
      - id: 2
        type: integer
        name: sensor
        class: measurement
        mapping:
          - scale: 10
            constraint: unit
            conditions:
              - dps_val: f
                value_redirect: temp_f
      - id: 113
        type: string
        name: unit
        mapping:
          - dps_val: f
            value: F
          - value: C
      - id: 129
        type: integer
        name: temp_f
        mapping:
          - scale: 10
  - entity: sensor
    class: ph
    dps:
      - id: 10
        type: integer
        name: sensor
        class: measurement
  - entity: sensor
    class: conductivity
    dps:
      - id: 11
        type: integer
        name: sensor
        unit: µS/cm
        class: measurement
        mapping:
          - scale: 100
  - entity: sensor
    name: ORP
    class: voltage
    dps:
      - id: 12
        type: integer
        name: sensor
        unit: mV
        class: measurement
  - entity: light
    translation_key: display
    category: config
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: sensor
    name: Salinity
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: ppt
        class: measurement
        mapping:
          - scale: 10
      - id: 102
        type: integer
        name: percentage
        mapping:
          - scale: 100
  - entity: sensor
    name: Specific gravity
    dps:
      - id: 103
        type: integer
        name: sensor
        mapping:
          - scale: 1000
  - entity: binary_sensor
    class: connectivity
    category: diagnostic
    dps:
      - id: 104
        type: boolean
        optional: true
        name: sensor
  - entity: sensor
    name: Residual chlorine
    dps:
      - id: 106
        type: integer
        name: sensor
        unit: mg/L
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    class: battery
    dps:
      - id: 107
        type: integer
        name: sensor
        unit: "%"
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 113
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
