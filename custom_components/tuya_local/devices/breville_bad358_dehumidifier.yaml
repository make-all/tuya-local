name: Dehumidifier
products:
  - id: lcjqatjseirq4msl
    manufacturer: Breville
    model: the All Climate 2-in-1 Dehumidifier & Purifier
    model_id: BAD358
entities:
  - entity: humidifier
    class: dehumidifier
    translation_only_key: extended
    dps:
      - id: 1
        name: switch
        type: boolean
      - id: 2
        name: humidity
        type: integer
        range:
          min: 30
          max: 80
        mapping:
          - step: 5
      - id: 5
        name: mode
        type: string
        mapping:
          - dps_val: Auto
            value: auto
          - dps_val: Dehumi
            value: continuous
          - dps_val: Drying
            value: laundry
          - dps_val: AirPurification
            value: purify
      - id: 6
        name: current_humidity
        type: integer
        mapping:
          - scale: 10
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 4
        type: string
        name: speed
        mapping:
          - dps_val: low
            value: 33
          - dps_val: mid
            value: 66
          - dps_val: high
            value: 100
  - entity: sensor
    class: temperature
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    translation_key: filter_life
    class: duration
    dps:
      - id: 101
        type: integer
        name: sensor
        unit: d
  - entity: select
    name: Oscillation
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: stop
            value: "Fixed"
          - dps_val: 80angle
            value: "Open"
          - dps_val: swing
            value: "Swing"
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 103
        type: integer
        name: option
        optional: true
        mapping:
          - dps_val: 0
            value: cancel
          - dps_val: 1
            value: "1h"
          - dps_val: 2
            value: "2h"
          - dps_val: 3
            value: "3h"
          - dps_val: 4
            value: "4h"
          - dps_val: 5
            value: "5h"
          - dps_val: 6
            value: "6h"
          - dps_val: 7
            value: "7h"
          - dps_val: 8
            value: "8h"
          - dps_val: 9
            value: "9h"
          - dps_val: 10
            value: "10h"
          - dps_val: 11
            value: "11h"
          - dps_val: 12
            value: "12h"
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 16
        type: boolean
        name: lock
  - entity: switch
    translation_key: sleep
    category: config
    dps:
      - id: 11
        type: boolean
        name: switch
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true
  - entity: switch
    translation_key: keytone
    category: config
    dps:
      - id: 104
        type: boolean
        name: switch
  - entity: light
    name: Humidity light
    category: config
    dps:
      - id: 105
        type: boolean
        name: switch
  - entity: light
    name: Tank light
    category: config
    dps:
      - id: 106
        type: boolean
        name: switch
  - entity: binary_sensor
    translation_key: tank_full
    dps:
      - id: 108
        type: boolean
        name: sensor
