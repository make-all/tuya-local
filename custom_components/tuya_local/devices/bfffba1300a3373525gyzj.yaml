  # === CAPTEURS (Lecture Seule) ===
  - entity: sensor
    name: Code Erreur
    dps:
      - id: 21
        type: integer
        name: sensor
  - entity: sensor
    name: Code Erreur 2
    dps:
      - id: 114
        type: integer
        name: sensor
  - entity: sensor
    name: Mode Inconnu
    dps:
      - id: 115
        type: string
        name: sensor
  - entity: binary_sensor
    name: Securite
