name: Energy Saver
entities:
  # === COMMANDES DE BASE ===
  - entity: switch
    name: Pompe Piscine
    dps:
      - id: 1
        type: boolean
        name: switch
  - entity: select
    name: Mode Pompe
    dps:
      - id: 4
        type: string
        name: option
        mapping:
          - dps_val: "day"
            value: "day"
          - dps_val: "night"
            value: "night"
          - dps_val: "backwash"
            value: "backwash"
  - entity: sensor
    name: Puissance
    class: power
    dps:
      - id: 12
        type: integer
        name: sensor
        unit: W
  - entity: number
    name: Temps de boost
    dps:
      - id: 101
        type: integer
        name: value
        unit: min
        range:
          min: 0
          max: 60

  # === VITESSES PRINCIPALES ===
  - entity: number
    name: Vitesse Night
    dps:
      - id: 102
        type: integer
        name: value
        range:
          min: 1200
          max: 1650
        mapping:
          - step: 50
  - entity: number
    name: Vitesse Day
    dps:
      - id: 103
        type: integer
        name: value
        range:
          min: 1700
          max: 2400
        mapping:
          - step: 50
  - entity: number
    name: Vitesse Backwash
    dps:
      - id: 104
        type: integer
        name: value
        range:
          min: 2450
          max: 2900
        mapping:
          - step: 50

  # === VITESSES PROGRAMMEES & AUTRES ===
  - entity: number
    name: Vitesse Prog 1
    dps:
      - id: 105
        type: integer
        name: value
        range:
          min: 1200
          max: 2900
        mapping:
          - step: 50
  - entity: number
