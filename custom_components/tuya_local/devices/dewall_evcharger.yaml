name: EV charger
products:
  - id: witok7vhhjohtr02
    manufacturer: dé
    model: Wall charger
  - id: gxrtu5vljdthtd3g
    manufacturer: dé
    model: GD portable charger
entities:
  - entity: sensor
    translation_key: status
    class: enum
    category: diagnostic
    dps:
      - id: 109
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: SLEEP
            value: sleep
          - dps_val: IDLE
            value: idle
          - dps_val: IDLEINS
            value: plugged_in
          - dps_val: WORKING
            value: charging
          - dps_val: WAIT
            value: waiting
          - dps_val: ERRORPAUSE
            value: fault
          - dps_val: PAUSE
            value: paused
          - dps_val: STOP
            value: charged
      - id: 103
        type: string
        optional: true
        name: selftest
      - id: 104
        type: string
        optional: true
        name: alarm
      - id: 105
        type: string
        optional: true
        name: history
      - id: 157
        type: integer
        optional: true
        name: product_variant
  - entity: sensor
    class: voltage
    translation_key: voltage_x
    translation_placeholders:
      x: L1
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: V
        json_path: L1.0
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    translation_key: current_x
    translation_placeholders:
      x: L1
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: A
        json_path: L1.1
        mapping:
          - scale: 10
  - entity: sensor
    class: power
    translation_key: power_x
    translation_placeholders:
      x: L1
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: kW
        json_path: L1.2
        mapping:
          - scale: 10
  - entity: sensor
    class: voltage
    translation_key: voltage_x
    translation_placeholders:
      x: L2
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: V
        json_path: L2.0
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    translation_key: current_x
    translation_placeholders:
      x: L2
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: A
        json_path: L2.1
        mapping:
          - scale: 10
  - entity: sensor
    class: power
    translation_key: power_x
    translation_placeholders:
      x: L2
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: kW
        json_path: L2.2
        mapping:
          - scale: 10
  - entity: sensor
    class: voltage
    translation_key: voltage_x
    translation_placeholders:
      x: L3
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: V
        json_path: L3.0
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    translation_key: current_x
    translation_placeholders:
      x: L3
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: A
        json_path: L3.1
        mapping:
          - scale: 10
  - entity: sensor
    class: power
    translation_key: power_x
    translation_placeholders:
      x: L3
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: kW
        json_path: L3.2
        mapping:
          - scale: 10
  - entity: sensor
    class: power
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: kW
        json_path: p
        mapping:
          - scale: 10
  - entity: sensor
    class: temperature
    category: diagnostic
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: C
        json_path: t
        mapping:
          - scale: 10
  - entity: sensor
    name: Charging session duration
    class: duration
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: measurement
        unit: min
        json_path: d
        mapping:
          - scale: 600
  - entity: sensor
    name: Charging session energy
    class: energy
    dps:
      - id: 102
        type: integer
        name: sensor
        optional: true
        class: total_increasing
        unit: kWh
        json_path: e
        mapping:
          - scale: 10
  - entity: sensor
    name: CP voltage
    class: voltage
    category: diagnostic
    dps:
      - id: 106
        type: float
        name: sensor
        optional: true
        class: measurement
        unit: V
        precision: 1
        json_path: cp
  - entity: sensor
    name: Total energy charged
    class: energy
    category: diagnostic
    dps:
      - id: 106
        type: integer
        name: sensor
        optional: true
        class: total_increasing
        unit: kWh
        json_path: e
        mapping:
          - scale: 10
  - entity: sensor
    name: Charging sessions
    icon: "mdi:counter"
    category: diagnostic
    dps:
      - id: 106
        type: integer
        name: sensor
        optional: true
        class: total_increasing
        precision: 0
        json_path: t
        mapping:
          - scale: 10
  - entity: sensor
    name: Firmware version
    icon: "mdi:chip"
    category: diagnostic
    dps:
      - id: 106
        type: string
        name: sensor
        optional: true
        json_path: fv
  - entity: sensor
    name: Protection type
    icon: "mdi:shield-check"
    category: diagnostic
    dps:
      - id: 106
        type: string
        name: sensor
        optional: true
        json_path: r
  - entity: button
    name: Charge
    icon: "mdi:ev-station"
    dps:
      - id: 140
        type: boolean
        optional: true
        name: button
  - entity: button
    name: Stop
    icon: "mdi:stop"
    dps:
      - id: 140
        type: boolean
        optional: true
        name: button
        mapping:
          - dps_val: false
            value: true
  - entity: button
    name: Reset
    icon: "mdi:refresh"
    category: config
    dps:
      - id: 141
        type: boolean
        optional: true
        name: button
  - entity: button
    class: restart
    category: config
    dps:
      - id: 142
        type: boolean
        optional: true
        name: button
  - entity: number
    name: Charge current
    category: config
    class: current
    dps:
      - id: 150
        type: integer
        name: value
        unit: A
        range:
          min: 1
          max: 1000
      - id: 152
        type: integer
        name: maximum
      - id: 107
        type: string
        name: steps
  - entity: number
    name: Maximum current
    category: config
    class: current
    dps:
      - id: 152
        type: integer
        name: value
        unit: A
        range:
          min: 1
          max: 1000
  - entity: select
    name: Plug in action
    icon: "mdi:ev-plug-type2"
    category: config
    dps:
      - id: 154
        type: integer
        optional: true
        name: option
        mapping:
          - dps_val: 0
            value: Prompt
          - dps_val: 1
            value: Charge
          - dps_val: 2
            value: Idle
  - entity: switch
    name: NFC
    icon: "mdi:nfc"
    category: config
    hidden: unavailable
    dps:
      - id: 155
        type: boolean
        optional: true
        name: switch
      - id: 157
        type: integer
        optional: true
        name: available
        mapping:
          - dps_val: 1
            value: false
          - value: true
  - entity: switch
    name: Unearthed
    icon: "mdi:lightning-bolt-circle"
    category: config
    dps:
      - id: 156
        type: boolean
        optional: true
        name: switch
  - entity: number
    name: Operating state
    category: config
    icon: "mdi:state-machine"
    hidden: true
    dps:
      - id: 101
        type: integer
        name: value
        range:
          min: 1
          max: 10000
  - entity: text
    name: Charger info
    category: config
    icon: "mdi:information"
    hidden: true
    dps:
      - id: 106
        type: string
        name: value
  - entity: text
    name: Charge mode
    category: config
    icon: "mdi:ev-station"
    hidden: true
    dps:
      - id: 151
        type: string
        name: value
  - entity: text
    name: Language config
    icon: "mdi:translate"
    category: config
    hidden: true
    dps:
      - id: 153
        type: string
        optional: true
        name: value
  - entity: button
    name: Refresh
    category: config
    hidden: unavailable
    dps:
      - id: 188
        type: boolean
        optional: true
        name: button
      - id: 188
        type: boolean
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
