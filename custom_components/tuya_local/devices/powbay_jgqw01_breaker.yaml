name: Energy monitor
products:
  - id: ejo7xbrodydgnavj
    manufacturer: PowBay
    model: JGQW01-63
entities:
  - entity: sensor
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100
  - entity: sensor
    class: voltage
    dps:
      - id: 6
        type: base64
        optional: true
        mask: "0000FFFF0000000000000000000000000000"
        name: sensor
        unit: V
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    dps:
      - id: 6
        type: base64
        optional: true
        mask: "00000000FFFFFF0000000000000000000000"
        name: sensor
        unit: A
        class: measurement
        mapping:
          - scale: 1000
            constraint: direction
            conditions:
              - dps_val: 1
                scale: -1000
      - id: 6
        type: base64
        optional: true
        mask: "000000000000000000000000000000000001"
        name: direction
  - entity: sensor
    class: power
    dps:
      - id: 6
        type: base64
        optional: true
        mask: "00000000000000FFFFFF0000000000000000"
        name: sensor
        unit: kW
        class: measurement
        mapping:
          - scale: 1000
            constraint: direction
            conditions:
              - dps_val: 1
                scale: -1000
      - id: 6
        type: base64
        optional: true
        mask: "000000000000000000000000000000000002"
        name: direction
  - entity: sensor
    class: reactive_power
    dps:
      - id: 6
        type: base64
        optional: true
        mask: "00000000000000000000FFFFFF0000000000"
        name: sensor
        unit: kvar
        class: measurement
        mapping:
          - scale: 1000
            constraint: direction
            conditions:
              - dps_val: 1
                scale: -1000
      - id: 6
        type: base64
        optional: true
        mask: "000000000000000000000000000000000004"
        name: direction
  - entity: sensor
    class: apparent_power
    dps:
      - id: 6
        type: base64
        optional: true
        mask: "00000000000000000000000000FFFFFF0000"
        name: sensor
        unit: kVA
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: power_factor
    dps:
      - id: 6
        type: base64
        optional: true
        mask: "00000000000000000000000000000000FF00"
        name: sensor
        class: measurement
        mapping:
          - scale: 100
            constraint: direction
            conditions:
              - dps_val: 1
                scale: -100
      - id: 6
        type: base64
        optional: true
        mask: "000000000000000000000000000000000008"
        name: direction
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 9
        type: bitfield
        name: fault_code
  - entity: switch
    name: Prepayment
    category: config
    dps:
      - id: 11
        type: boolean
        name: switch
  - entity: button
    name: Clear energy
    category: config
    dps:
      - id: 12
        type: boolean
        optional: true
        name: button
  - entity: sensor
    name: Balance energy
    class: energy_storage
    category: diagnostic
    dps:
      - id: 13
        type: integer
        name: sensor
        unit: kWh
        class: measurement
        mapping:
          - scale: 100
  - entity: number
    name: Charge energy
    category: config
    class: energy_storage
    dps:
      - id: 14
        type: integer
        name: value
        unit: kWh
        range:
          min: 0
          max: 999999
        mapping:
          - scale: 100
  - entity: switch
    translation_key: breaker
    dps:
      - id: 16
        type: boolean
        name: switch
      - id: 19
        type: string
        name: breaker_id
      - id: 41
        type: string
        name: product
  - entity: text
    name: Alarm set 1
    category: config
    icon: "mdi:alarm"
    hidden: true
    dps:
      - id: 17
        type: base64
        optional: true
        name: value
  - entity: text
    name: Alarm set 2
    category: config
    icon: "mdi:alarm"
    hidden: true
    dps:
      - id: 18
        type: base64
        optional: true
        name: value
  - entity: sensor
    class: frequency
    dps:
      - id: 32
        type: integer
        name: sensor
        unit: Hz
        class: measurement
        mapping:
          - scale: 100
  - entity: text
    name: Power off delay settings
    category: config
    icon: "mdi:cogs"
    hidden: true
    dps:
      - id: 33
        type: base64
        optional: true
        name: value
  - entity: button
    translation_key: factory_reset
    category: config
    hidden: true
    dps:
      - id: 34
        type: boolean
        optional: true
        name: button
  - entity: sensor
    class: temperature
    dps:
      - id: 47
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: select
    translation_key: initial_state
    category: config
    dps:
      - id: 61
        type: string
        name: option
        mapping:
          - dps_val: "off"
            value: "off"
          - dps_val: "on"
            value: "on"
          - dps_val: memory
            value: memory
  - entity: text
    translation_key: schedule
    category: config
    hidden: true
    dps:
      - id: 63
        type: string
        name: value
  - entity: light
    translation_key: display
    category: config
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: number
    name: Overvoltage recovery delay
    category: config
    class: duration
    dps:
      - id: 102
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 1000000000
          # 31 years seems excessive, but that is what the docs say
  - entity: number
    name: Power on delay
    category: config
    class: duration
    dps:
      - id: 104
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 9999999
          # almost 4 months seems excessive, but that is what the docs say
