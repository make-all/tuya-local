name: Ceiling fan
products:
  - id: 9rwue3dqsw0e9r3v
    manufacturer: Brilliant Smart
    model: DC 5 speed
entities:
  - entity: fan
    translation_key: fan_with_presets
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: nature
            value: nature
          - dps_val: Normal
            value: normal
          - dps_val: Sleep
            value: sleep
          - dps_val: WakeUp
            value: fresh
      - id: 3
        type: string
        name: speed
        mapping:
          - dps_val: "1"
            value: 20
          - dps_val: "2"
            value: 40
          - dps_val: "3"
            value: 60
          - dps_val: "4"
            value: 80
          - dps_val: "5"
            value: 100
      - id: 4
        type: string
        name: direction
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 6
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: cancel
          - dps_val: "1"
            value: "10m"
          - dps_val: "2"
            value: "30m"
          - dps_val: "3"
            value: "1h"
          - dps_val: "4"
            value: "2h"
          - dps_val: "5"
            value: "3h"
          - dps_val: "6"
            value: "4h"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 7
        type: integer
        optional: true
        name: sensor
        unit: min
  - entity: light
    dps:
      - id: 9
        type: boolean
        name: switch
