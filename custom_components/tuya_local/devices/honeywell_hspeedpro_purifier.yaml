name: Purifier
# products:
#   - id: UNKNOWN
#     manufacturer: Honeywell
#     model: H-Speed Pro
entities:
  - entity: fan
    translation_key: air_purifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 4
        type: string
        name: speed
        mapping:
          - dps_val: "1"
            value: 11
          - dps_val: "2"
            value: 22
          - dps_val: "3"
            value: 33
          - dps_val: "4"
            value: 44
          - dps_val: "5"
            value: 55
          - dps_val: "6"
            value: 66
          - dps_val: "7"
            value: 77
          - dps_val: "8"
            value: 88
          - dps_val: "9"
            value: 100
      - id: 105
        type: boolean
        name: preset_mode
        mapping:
          - dps_val: true
            value: auto
          - dps_val: false
            value: manual
  - entity: sensor
    class: pm25
    dps:
      - id: 2
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    translation_key: filter_life
    dps:
      - id: 5
        type: integer
        name: sensor
        unit: "%"
        mapping:
          - scale: 100
      - id: 108
        type: string
        optional: true
        name: replacement_date
  - entity: light
    translation_key: indicator
    category: config
    dps:
      - id: 8
        type: boolean
        name: switch
  - entity: sensor
    class: temperature
    dps:
      - id: 12
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    class: humidity
    dps:
      - id: 13
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: sensor
    class: enum
    translation_key: air_quality
    dps:
      - id: 21
        type: string
        name: sensor
        mapping:
          - dps_val: good
            value: good
          - dps_val: medium
            value: moderate
          - dps_val: severe
            value: severe
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 22
        type: bitfield
        name: fault_code
  - entity: sensor
    name: Formaldehyde
    class: volatile_organic_compounds
    dps:
      - id: 27
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: switch
    translation_key: uv_sterilization
    category: config
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: button
    translation_key: filter_reset
    category: config
    dps:
      - id: 102
        type: boolean
        optional: true
        name: button
  - entity: switch
    translation_key: sleep
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 106
        type: boolean
        name: lock
