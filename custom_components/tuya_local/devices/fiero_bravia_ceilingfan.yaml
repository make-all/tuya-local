name: Ceiling fan
products:
  - id: iodpj2gtttcqpu4c
    manufacturer: Fiero
    model: Bravia
    model_id: "46Wi"
entities:
  - entity: fan
    translation_key: fan_with_presets
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: nature
            value: nature
          - dps_val: sleep
            value: sleep
          - dps_val: custom
            value: custom
      - id: 3
        type: integer
        name: speed
        range:
          min: 1
          max: 12
      - id: 8
        type: string
        name: direction
      - id: 101
        type: bitfield
        name: model
      - id: 102
        type: bitfield
        name: dev_num
      - id: 103
        type: integer
        name: version
  - entity: light
    dps:
      - id: 15
        type: boolean
        name: switch
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 105
        type: boolean
        name: switch
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 106
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
